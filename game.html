<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节奏史莱姆</title>
    <style>
        :root {
            --theme-hue: 0deg;
            --bg-color: hsl(calc(215deg + var(--theme-hue)), 45%, 12%);
            --text-main: #fff;
            --text-sub: hsl(calc(203deg + var(--theme-hue)), 25%, 69%);
            --panel-bg: hsla(calc(217deg + var(--theme-hue)), 66%, 12%, 0.85);
            --container-bg: hsla(calc(216deg + var(--theme-hue)), 71%, 7%, 0.6);
            --overlay-bg: hsla(calc(212deg + var(--theme-hue)), 86%, 5%, 0.85);
            --border-main: hsl(calc(197deg + var(--theme-hue)), 62%, 38%);
            --border-sub: hsla(calc(202deg + var(--theme-hue)), 100%, 60%, 0.3);
            --border-active: hsl(calc(202deg + var(--theme-hue)), 100%, 60%);
            --card-bg: hsla(calc(202deg + var(--theme-hue)), 100%, 60%, 0.15);
            --hud-bg: rgba(0, 0, 0, 0.5);
            --key-bg: hsl(calc(213deg + var(--theme-hue)), 76%, 8%);
            --setting-bg: hsla(calc(217deg + var(--theme-hue)), 66%, 12%, 0.6);
            --text-perfect: #ffcc00;
            --text-great: #00ccff;
            --text-good: #a3ff66;
            --text-miss: #aaaaaa;
            --text-score: #00ffcc;
            --text-combo: #ff00ff;
            --btn-bg: hsl(calc(207deg + var(--theme-hue)), 80%, 45%);
            --btn-hover: hsl(calc(207deg + var(--theme-hue)), 80%, 55%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* 兼容不支持 dvh 的旧版浏览器 */
            min-height: 100dvh;
            /* 动态视口高度，防止移动端上下栏遮挡 */
            transition: background-color 0.3s, color 0.3s;
        }

        /* 霓虹背景星空效果 */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, hsl(calc(204deg + var(--theme-hue)), 40%, 28%) 0%, var(--bg-color) 70%);
            transition: background 0.3s;
            z-index: -2;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                /* 大十字星 */
                radial-gradient(ellipse 30px 1.5px at 50% 50%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(ellipse 1.5px 30px at 50% 50%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(circle 2.5px at 50% 50%, rgba(255, 255, 255, 1), transparent),
                /* 中十字星 */
                radial-gradient(ellipse 20px 1px at 20% 80%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(ellipse 1px 20px at 20% 80%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(circle 1.5px at 20% 80%, rgba(255, 255, 255, 0.8), transparent),
                /* 小十字星 */
                radial-gradient(ellipse 12px 1px at 80% 30%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(ellipse 1px 12px at 80% 30%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(circle 1px at 80% 30%, rgba(255, 255, 255, 0.6), transparent);
            background-size: 550px 550px, 550px 550px, 550px 550px,
                350px 350px, 350px 350px, 350px 350px,
                250px 250px, 250px 250px, 250px 250px;
            background-position: 0 0, 0 0, 0 0,
                40px 60px, 40px 60px, 40px 60px,
                130px 270px, 130px 270px, 130px 270px;
            opacity: 0.5;
            z-index: -1;
            transition: opacity 0.3s, filter 0.3s;
        }

        /* 主容器 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            border: 2px solid var(--border-main);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--border-sub);
            overflow: hidden;
        }

        /* 顶部配置面板 */
        .config-panel {
            background: var(--panel-bg);
            padding: 15px;
            border-bottom: 2px solid var(--border-main);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .config-label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: bold;
        }

        .file-input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        .file-input {
            width: 100%;
            font-size: 12px;
            background: var(--key-bg);
            border: 1px solid var(--border-active);
            border-radius: 4px;
            color: var(--text-main);
            padding: 4px;
        }

        .btn {
            background: var(--btn-bg);
            border: none;
            border-radius: 6px;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.45);
            /* 确保文字上下完美对齐 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.6);
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 游戏渲染区 */
        .stage {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI层覆盖 */
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .hud-item {
            font-family: sans-serif;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .score-val {
            color: var(--text-score);
            font-weight: bold;
        }

        .combo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            position: absolute;
            top: 100px;
            right: 65px;
            transform: translateX(50%);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            visibility: hidden;
        }

        .combo-val {
            color: var(--text-combo);
            font-weight: 900;
            font-size: 36px;
        }

        .combo-label {
            font-size: 14px;
            letter-spacing: 0px;
            margin-top: 4px;
            color: white;
        }

        .combo-white .combo-val {
            color: white !important;
            background: none !important;
            -webkit-background-clip: border-box !important;
            background-clip: border-box !important;
        }

        .combo-pink .combo-val {
            color: #b6ffdf !important;
            background: none !important;
            -webkit-background-clip: border-box !important;
            background-clip: border-box !important;
        }

        .combo-rainbow .combo-val {
            background: linear-gradient(90deg, #ffb347, #ffde59, #85e085, #4ecdc4) !important;
            background-size: 100% 100% !important;
            color: transparent !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            animation: rainbow-anim 2s linear infinite;
        }

        @keyframes rainbow-anim {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        @keyframes combo-pop {
            0% {
                transform: translateX(50%) scale(1);
            }

            50% {
                transform: translateX(50%) scale(1.02);
            }

            100% {
                transform: translateX(50%) scale(1);
            }
        }

        /* 判定字样动画效果 */
        .judge-display {
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 25px;
            font-weight: 900;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @keyframes judgePopup {
            0% {
                transform: translate(-50%, -30%);
                opacity: 0;
            }

            15% {
                transform: translate(-50%, -50%);
                opacity: 1;
            }

            80% {
                transform: translate(-50%, -50%);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%);
                opacity: 0;
            }
        }

        .judge-perfect {
            color: var(--text-perfect);
            animation: judgePopup 0.6s ease-out forwards;
        }

        .judge-great {
            color: var(--text-great);
            animation: judgePopup 0.6s ease-out forwards;
        }

        .judge-good {
            color: var(--text-good);
            animation: judgePopup 0.6s ease-out forwards;
        }

        .judge-miss {
            color: var(--text-miss);
            animation: judgePopup 0.6s ease-out forwards;
        }

        .fast-slow-display {
            position: absolute;
            bottom: 80%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            padding: 2px 8px;
            border-radius: 8px;
            color: #fff;
            opacity: 0;
            white-space: nowrap;
            text-shadow: none;
        }

        .fast-slow-fast {
            background-color: #3498db;
            opacity: 1;
        }

        .fast-slow-slow {
            background-color: #e74c3c;
            opacity: 1;
        }

        /* FC/AP 动画特效 */
        .fc-ap-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            white-space: nowrap;
            padding: 0 20px;
            /* 增加水平内边距，防止斜体超出裁切边界被截断 */
            background: linear-gradient(90deg, #ff8b8b, #ffcd88, #ffe787, #85e085, #4ecdc4, #c9a0dc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        .fc-ap-display.type-clear {
            background: none;
            -webkit-text-fill-color: white;
            color: white;
        }

        @keyframes fcApPopup {
            0% {
                transform: translate(-50%, -20%);
                opacity: 0;
                animation-timing-function: ease-out;
                /* 先快后慢平滑缓出曲线 */
            }

            9% {
                transform: translate(-50%, -50%);
                opacity: 0.8;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
                animation-timing-function: linear;
            }

            10% {
                transform: translate(-50%, -50%);
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1));
                animation-timing-function: linear;
            }

            90% {
                transform: translate(-50%, -50%);
                opacity: 1;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
                animation-timing-function: linear;
            }

            100% {
                transform: translate(-50%, -50%);
                /* 去掉向上的位置变化，保持原地不动 */
                opacity: 0;
            }
        }

        @keyframes fcApPopupGold {
            0% {
                transform: translate(-50%, -20%);
                opacity: 0;
                animation-timing-function: ease-out;
            }

            9% {
                transform: translate(-50%, -50%);
                opacity: 0.8;
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
                animation-timing-function: linear;
            }

            10% {
                transform: translate(-50%, -50%);
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1));
                animation-timing-function: linear;
            }

            90% {
                transform: translate(-50%, -50%);
                opacity: 1;
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
                animation-timing-function: linear;
            }

            100% {
                transform: translate(-50%, -50%);
                opacity: 0;
            }
        }

        /* 底部键位提示 */
        .key-hints {
            display: flex;
            width: 100%;
            background: var(--key-bg);
            border-top: 2px solid var(--border-main);
            height: 45px;
        }

        .key-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border-right: 1px solid var(--border-sub);
            color: var(--border-active);
        }

        .key-box:last-child {
            border-right: none;
        }

        .key-box.active {
            background: var(--border-sub);
            color: var(--text-main);
            text-shadow: 0 0 8px #fff;
        }

        /* 遮罩/开始界面 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 24px;
            color: var(--text-perfect);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .overlay p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .shortcut-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-sub);
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-combo);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.45);
        }

        /* 结算界面统计样式 */
        .result-stats {
            background: var(--card-bg);
            border: 2px solid var(--border-sub);
            border-radius: 10px;
            padding: 20px;
            font-size: 16px;
            text-align: left;
            line-height: 2;
            width: 100%;
            max-width: 300px;
            color: var(--text-main);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }

        .result-stats div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-stats span:last-child {
            font-weight: bold;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 18px;
            min-width: 80px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 移动端全屏适配 */
        @media (max-width: 600px) {
            .game-container {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: none;
                border: none;
                border-radius: 0;
            }

            .key-hints {
                display: none;
            }
        }

        @keyframes slimeJump {
            0% {
                transform: translateY(0) scale(1, 1);
                animation-timing-function: ease-out;
            }

            10% {
                transform: translateY(0) scale(1.1, 0.9);
                animation-timing-function: ease-out;
            }

            30% {
                transform: translateY(-25px) scale(0.85, 1.15);
                animation-timing-function: ease-in;
            }

            50% {
                transform: translateY(0) scale(1.15, 0.85);
                animation-timing-function: ease-out;
            }

            70% {
                transform: translateY(-15px) scale(0.9, 1.1);
                animation-timing-function: ease-in;
            }

            90% {
                transform: translateY(0) scale(1.1, 0.9);
                animation-timing-function: ease-out;
            }

            100% {
                transform: translateY(0) scale(1, 1);
            }
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>
    <div class="stars"></div>

    <div class="game-container">
        <!-- 顶部控制与自定义上传配置面板 -->
        <div class="config-panel">
            <div class="config-row" style="justify-content: center; gap: 15px;">
                <button id="btnBackToMenu" class="btn" data-i18n="backToMenu">返回选歌</button>
                <button id="btnPlayPause" class="btn" disabled data-i18n="waiting">等待加载...</button>
            </div>

            <!-- 结算界面遮罩层 -->
            <div id="resultOverlay" class="overlay hidden">
                <h2 data-i18n="gameOver" style="margin-bottom: 5px;">游戏结束</h2>
                <div id="resAutoPlayLabel"
                    style="display: none; color: var(--text-perfect); margin-bottom: 15px; font-weight: bold; font-size: 14px;"
                    data-i18n="autoPlayMode">自动演奏模式</div>
                <div class="result-stats">
                    <div><span data-i18n="score">得分: </span><span id="resScore">0</span></div>
                    <div><span data-i18n="maxCombo">最大连击: </span><span id="resCombo">0</span></div>
                    <hr style="border-color: var(--border-sub); margin: 10px 0;">
                    <div style="color: var(--text-perfect);">PERFECT: <span id="resPerfect">0</span></div>
                    <div style="color: var(--text-great);">GREAT: <span id="resGreat">0</span></div>
                    <div style="color: var(--text-good);">GOOD: <span id="resGood">0</span></div>
                    <div style="color: var(--text-miss);">MISS: <span id="resMiss">0</span></div>
                    <hr style="border-color: var(--border-sub); margin: 10px 0;">
                    <div style="color: #3498db; font-size: 14px;">FAST: <span id="resFast">0</span></div>
                    <div style="color: #e74c3c; font-size: 14px;">SLOW: <span id="resSlow">0</span></div>
                </div>
                <button id="btnResultBack" class="btn" style="margin-top: 20px; padding: 10px 30px; font-size: 16px;"
                    data-i18n="backToMenu">返回选歌</button>
            </div>
        </div>

        <!-- 游戏舞台 -->
        <div class="stage" id="stageContainer">
            <div class="hud">
                <div class="hud-item">SCORE <span id="scoreText" class="score-val">000000</span></div>
                <div class="hud-item combo-item">
                    <div id="comboText" class="combo-val">0</div>
                    <div class="combo-label">COMBO</div>
                </div>
            </div>

            <!-- 动态判定提示 -->
            <div id="judgeDisplay" class="judge-display">
                <div id="fastSlowDisplay" class="fast-slow-display"></div>
                <span id="judgeText">PERFECT</span>
            </div>

            <!-- 增加全连/全P判定特效 -->
            <div id="fcApDisplay" class="fc-ap-display" style="display: none;">FULL COMBO</div>

            <canvas id="gameCanvas"></canvas>

            <!-- 开始/就绪遮罩层 -->
            <div id="startOverlay" class="overlay" style="padding: 20px;">
                <h2 id="readyTitle" data-i18n="waiting" style="margin-bottom: 20px;">等待加载...</h2>
                <canvas id="loadingCanvas"
                    style="display: block; margin: 0 auto; transform-origin: bottom center;"></canvas>
                <div id="loadingText" style="margin-top: 20px; font-size: 18px; font-weight: bold; color: #fff;">0%
                </div>
            </div>
        </div>

        <!-- 底部物理键盘同步高亮指示 -->
        <div class="key-hints">
            <div class="key-box" id="key0">S</div>
            <div class="key-box" id="key1">D</div>
            <div class="key-box" id="key2">J</div>
            <div class="key-box" id="key3">K</div>
        </div>
    </div>

    <script>
        // --- 国际化 (i18n) 字典与逻辑 ---
        const i18n = {
            zh: {
                backToMenu: "返回选歌",
                waiting: "等待加载...",
                gameOver: "游戏结束",
                score: "得分: ",
                maxCombo: "最大连击: ",
                songSelect: "选歌界面",
                loadingSongs: "正在加载歌单和基础资源...",
                language: "语言 / Language:",
                selectSong: "请选择歌曲",
                loadFailed: "加载失败",
                decoding: "解码中...",
                resume: "继续游戏",
                pause: "暂停游戏",
                autoPlayMode: "自动演奏模式"
            },
            en: {
                backToMenu: "Back to Menu",
                waiting: "Loading...",
                gameOver: "Game Over",
                score: "Score: ",
                maxCombo: "Max Combo: ",
                songSelect: "Select Song",
                loadingSongs: "Loading songs and resources...",
                language: "Language / 语言:",
                selectSong: "Select a song",
                loadFailed: "Load Failed",
                decoding: "Decoding...",
                resume: "Resume",
                pause: "Pause",
                autoPlayMode: "AutoPlay Mode"
            }
        };

        let currentLang = localStorage.getItem('slime_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');

        function t(key) { return i18n[currentLang][key] || key; }

        function updateUIi18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
            });
            document.getElementById('btnLangToggle').textContent = currentLang === 'zh' ? '简体中文' : 'English';

            // 更新动态状态文本
            if (isPlaying) {
                btnPlayPause.textContent = t('pause');
            } else if (isSongEnding) {
                btnPlayPause.textContent = t('gameOver');
            } else {
                btnPlayPause.textContent = t('resume');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUIi18n();
        });

        // --- 核心配置与全局状态 ---
        let themeHueOffset = 0;
        let slimeScaleFactor = 1.0;
        const PUNCH_KEYS = ['s', 'd', 'j', 'k'];

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getCustomSong(id) {
            return openDB().then(db => {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.onerror);
                });
            });
        }

            if (!song || !song.audio) throw new Error("Audio not found in IndexedDB");
            if (song.audio instanceof Blob) {
                return await song.audio.arrayBuffer();
            } else if (typeof song.audio === 'string' && song.audio.startsWith('data:')) {
                const res = await fetch(song.audio);
                return await res.arrayBuffer();
            } else {
                throw new Error("Unsupported audio storage type");

        function drawLoadingCanvas(percent) {
            const canvas = document.getElementById('loadingCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let drawWidth = 150, drawHeight = 100;
            let img = null;
            let imgLoading = false;
            for (let i = 0; i < 4; i++) {
                if (customSlimeImages[i]) {
                    if (customSlimeImages[i].complete && customSlimeImages[i].naturalWidth > 0) {
                        img = customSlimeImages[i];
                    } else {
                        imgLoading = true;
                    }
                    break;
                }
            }

            if (imgLoading && !img) {
                return; // Wait for image to load to avoid flashing slime
            }

            if (img) {
                const imgRatio = img.width / img.height;
                if (imgRatio > 150 / 100) {
                    drawWidth = 150;
                    drawHeight = 150 / imgRatio;
                } else {
                    drawHeight = 100;
                    drawWidth = 100 * imgRatio;
                }
            } else {
                const ratio = 2 / 2.2;
                if (ratio > 120 / 80) {
                    drawWidth = 120;
                    drawHeight = 120 / ratio;
                } else {
                    drawHeight = 80;
                    drawWidth = 80 * ratio;
                }
            }

            canvas.width = drawWidth;
            canvas.height = drawHeight;
            canvas.style.width = drawWidth + 'px';
            canvas.style.height = drawHeight + 'px';

            ctx.clearRect(0, 0, drawWidth, drawHeight);

            // Draw silhouette
            ctx.save();
            if (img) {
                ctx.globalAlpha = 0.3;
                ctx.filter = 'brightness(0)';
                ctx.drawImage(img, 0, 0, drawWidth, drawHeight);
                ctx.filter = 'none';
                ctx.globalAlpha = 1.0;
            } else {
                ctx.globalAlpha = 0.3;
                drawLoadingSlime(ctx, drawWidth, drawHeight, true);
                ctx.globalAlpha = 1.0;
            }
            ctx.restore();

            // Draw filled part with clipping
            ctx.save();
            ctx.beginPath();
            const clipHeight = drawHeight * (percent / 100);
            ctx.rect(0, drawHeight - clipHeight, drawWidth, clipHeight);
            ctx.clip();

            if (img) {
                ctx.drawImage(img, 0, 0, drawWidth, drawHeight);
            } else {
                drawLoadingSlime(ctx, drawWidth, drawHeight, false);
            }
            ctx.restore();
        }

        function drawLoadingSlime(ctx, width, height, isSilhouette) {
            const radius = width / 2;
            const x = radius;
            const y = radius * 1.3;

            ctx.save();
            ctx.translate(x, y);

            const gradient = ctx.createRadialGradient(0, -radius * 0.2, radius * 0.2, 0, 0, radius);
            if (isSilhouette) {
                gradient.addColorStop(0, '#888888');
                gradient.addColorStop(1, '#555555');
            } else {
                const hue = (202 + themeHueOffset) % 360;
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.3, `hsl(${hue}, 100%, 60%)`);
                gradient.addColorStop(1, `hsl(${hue}, 100%, 36%)`);
            }

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(-radius, 0);
            ctx.bezierCurveTo(-radius, -radius * 1.1, -radius * 0.6, -radius * 1.3, 0, -radius * 1.3);
            ctx.bezierCurveTo(radius * 0.6, -radius * 1.3, radius, -radius * 1.1, radius, 0);
            ctx.bezierCurveTo(radius, radius * 0.6, radius * 0.7, radius * 0.9, 0, radius * 0.9);
            ctx.bezierCurveTo(-radius * 0.7, radius * 0.9, -radius, radius * 0.6, -radius, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#110224';
            ctx.beginPath();
            ctx.arc(-radius * 0.35, -radius * 0.35, radius * 0.12, 0, Math.PI * 2);
            ctx.arc(radius * 0.35, -radius * 0.35, radius * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-radius * 0.32, -radius * 0.38, radius * 0.04, 0, Math.PI * 2);
            ctx.arc(radius * 0.38, -radius * 0.38, radius * 0.04, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#110224';
            ctx.lineWidth = Math.max(1, radius * 0.05);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(-radius * 0.08, -radius * 0.15, radius * 0.08, 0, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(radius * 0.08, -radius * 0.15, radius * 0.08, 0, Math.PI);
            ctx.stroke();

            ctx.restore();
        }

        function updateProgress() {
            if (DEBUG_FIXED_LOADING_TIME) return; // 测试模式下由假进度条接管

            let sumLoaded = 0;

            for (let prog of progressMap.values()) {
                if (prog.total > 0) {
                    sumLoaded += prog.loaded;
                    sumTotal += prog.total;
                }
            }
            if (sumTotal > 0) {
                const percent = Math.min(100, Math.round((sumLoaded / sumTotal) * 100));
                const progressText = document.getElementById('loadingText');
                if (progressText) progressText.textContent = percent + '%';
                drawLoadingCanvas(percent);

        }

        async function fetchAudioAsArrayBuffer(url) {
            try {
                if (url.startsWith('data:') || url.startsWith('blob:')) {
                    const res = await fetch(url);
                    return await res.arrayBuffer();
                }

                return await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', url);
                    xhr.responseType = 'arraybuffer';
                    progressMap.set(url, { loaded: 0, total: 0 });
                    xhr.onprogress = (e) => {
                        if (e.lengthComputable) {
                            progressMap.set(url, { loaded: e.loaded, total: e.total });
                            updateProgress();
                        }
                    };
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            progressMap.set(url, { loaded: xhr.response.byteLength, total: xhr.response.byteLength });
                            updateProgress();
                            resolve(xhr.response);
                        } else {
                            reject(new Error(xhr.statusText));
                        }
                    };
                    xhr.onerror = () => reject(new Error("Network Error"));
                    xhr.send();
                });
            } catch (e) {
                console.warn('音效加载失败:', url);
                return null;
            }
        }

        // --- 变速谱面：时间与节拍映射核心 ---
        function processTimingPoints(chartObj) {
            let baseBpm = chartObj.bpm || 120;
            let list = chartObj.bpmList || [{ beat: 0, bpm: baseBpm }];
            list.sort((a, b) => a.beat - b.beat);

            timingPoints = [];
            let currentTime = 0;

            for (let i = 0; i < list.length; i++) {
                let tp = list[i];
                if (i > 0) {
                    let prevTp = timingPoints[i - 1];
                    let beatsDiff = tp.beat - prevTp.beat;
                    let msPerBeat = 60000 / prevTp.bpm;
                    currentTime += beatsDiff * msPerBeat;
                }
                timingPoints.push({ beat: tp.beat, bpm: tp.bpm, timeMs: currentTime });
            }
        }

        function beatToTime(beat) {
            if (timingPoints.length === 0) return beat * (60000 / 120);
            let tp = timingPoints[0];
            for (let i = timingPoints.length - 1; i >= 0; i--) {
                if (beat >= timingPoints[i].beat) {
                    tp = timingPoints[i];
                    break;
                }
            }
            let beatsDiff = beat - tp.beat;
            let msPerBeat = 60000 / tp.bpm;
            return tp.timeMs + beatsDiff * msPerBeat;
        }

        function timeToBeat(timeMs) {
            if (timingPoints.length === 0) return timeMs / (60000 / 120);
            let tp = timingPoints[0];
            // 时间在第一个节点之前（比如开局等待时间）
            if (timeMs < tp.timeMs) {
                let msPerBeat = 60000 / tp.bpm;
                return tp.beat + (timeMs - tp.timeMs) / msPerBeat;
            }
            for (let i = timingPoints.length - 1; i >= 0; i--) {
                if (timeMs >= timingPoints[i].timeMs) {
                    tp = timingPoints[i];
                    break;
                }
            }
            let timeDiff = timeMs - tp.timeMs;
            let msPerBeat = 60000 / tp.bpm;
            return tp.beat + timeDiff / msPerBeat;
        }

        function loadChartData(chartObj) {
            processTimingPoints(chartObj);

            // 计算每个音符达到判定线的绝对目标毫秒时间戳
            chartNotes = chartObj.notes.map((n, idx) => {
                return {
                    id: idx,
                    beat: n.beat,
                    endBeat: n.endBeat,
                    lane: n.lane,
                    timeMs: beatToTime(n.beat),
                    endTimeMs: n.endBeat ? beatToTime(n.endBeat) : null,
                    hitState: 0, // 0:未处理, 1:Perfect, 2:Good, 3:Miss, 4:Great, 5:Holding
                    startHitType: null // 记录按下的最初判定级别
                };
            }).sort((a, b) => a.timeMs - b.timeMs);

            chartFeverIntervals = [];
            if (chartObj.feverList && chartObj.feverList.length > 0) {
                let sortedList = [...chartObj.feverList].sort((a, b) => a.beat - b.beat);
                let currentStart = -1;
                for (let f of sortedList) {
                    if (f.type === 'start') {
                        currentStart = f.beat;
                    } else if (f.type === 'end' && currentStart !== -1) {
                        chartFeverIntervals.push({ start: currentStart, end: f.beat });
                        currentStart = -1;
                    }
                }
            }

            resetGameState();
        }
