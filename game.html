<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节奏史莱姆</title>
    <style>
         :root {
            --theme-hue: 0deg;
            --bg-color: hsl(calc(215deg + var(--theme-hue)), 45%, 12%);
            --text-main: #fff;
            --text-sub: hsl(calc(203deg + var(--theme-hue)), 25%, 69%);
            --panel-bg: hsla(calc(217deg + var(--theme-hue)), 66%, 12%, 0.85);
            --container-bg: hsla(calc(216deg + var(--theme-hue)), 71%, 7%, 0.6);
            --overlay-bg: hsla(calc(212deg + var(--theme-hue)), 86%, 5%, 0.85);
            --border-main: hsl(calc(197deg + var(--theme-hue)), 62%, 38%);
            --border-sub: hsla(calc(202deg + var(--theme-hue)), 100%, 60%, 0.3);
            --border-active: hsl(calc(202deg + var(--theme-hue)), 100%, 60%);
            --card-bg: hsla(calc(202deg + var(--theme-hue)), 100%, 60%, 0.15);
            --hud-bg: rgba(0, 0, 0, 0.5);
            --key-bg: hsl(calc(213deg + var(--theme-hue)), 76%, 8%);
            --setting-bg: hsla(calc(217deg + var(--theme-hue)), 66%, 12%, 0.6);
            --text-perfect: #ffcc00;
            --text-great: #00ccff;
            --text-good: #a3ff66;
            --text-miss: #aaaaaa;
            --text-score: #00ffcc;
            --text-combo: #ff00ff;
            --btn-bg: hsl(calc(207deg + var(--theme-hue)), 80%, 45%);
            --btn-hover: hsl(calc(207deg + var(--theme-hue)), 80%, 55%);
        }

        body.light-mode {
            --bg-color: #e6edf5;
            --bg-color: hsl(calc(212deg + var(--theme-hue)), 41%, 93%);
            --text-main: hsl(calc(210deg + var(--theme-hue)), 39%, 17%);
            --text-sub: hsl(calc(209deg + var(--theme-hue)), 24%, 38%);
            --panel-bg: hsla(calc(208deg + var(--theme-hue)), 100%, 97%, 0.9);
            --container-bg: hsla(calc(208deg + var(--theme-hue)), 100%, 97%, 0.7);
            --overlay-bg: hsla(calc(208deg + var(--theme-hue)), 100%, 97%, 0.9);
            --border-main: hsl(calc(217deg + var(--theme-hue)), 89%, 75%);
            --border-sub: hsla(calc(202deg + var(--theme-hue)), 100%, 60%, 0.4);
            --border-active: hsl(calc(207deg + var(--theme-hue)), 100%, 45%);
            --card-bg: rgba(255, 255, 255, 0.6);
            --hud-bg: rgba(255, 255, 255, 0.7);
            --key-bg: hsl(calc(209deg + var(--theme-hue)), 62%, 89%);
            --setting-bg: rgba(255, 255, 255, 0.8);
            --text-perfect: #e9af01;
            --text-great: #0093c9;
            --text-good: #5fbe00;
            --text-miss: #777777;
            --text-score: #1aa085;
            --text-combo: #b300b3;
            --btn-bg: hsl(calc(207deg + var(--theme-hue)), 80%, 55%);
            --btn-hover: hsl(calc(207deg + var(--theme-hue)), 80%, 65%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* 兼容不支持 dvh 的旧版浏览器 */
            min-height: 100dvh; /* 动态视口高度，防止移动端上下栏遮挡 */
            transition: background-color 0.3s, color 0.3s;
        }

        /* 霓虹背景星空效果 */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, hsl(calc(204deg + var(--theme-hue)), 40%, 28%) 0%, var(--bg-color) 70%);
            transition: background 0.3s;
            z-index: -2;
        }
        body.light-mode .bg-glow {
            background: radial-gradient(circle at 50% 30%, hsl(calc(210deg + var(--theme-hue)), 100%, 85%) 0%, var(--bg-color) 70%);
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.4;
            z-index: -1;
            transition: opacity 0.3s, filter 0.3s;
        }

        body.light-mode .stars {
            opacity: 0.9;
            filter: drop-shadow(0 0 3px hsla(calc(210deg + var(--theme-hue)), 60%, 40%, 0.5));
        }

        /* 主容器 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            border: 2px solid var(--border-main);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--border-sub);
            overflow: hidden;
        }

        /* 顶部配置面板 */
        .config-panel {
            background: var(--panel-bg);
            padding: 15px;
            border-bottom: 2px solid var(--border-main);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .config-label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: bold;
        }

        .file-input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        .file-input {
            width: 100%;
            font-size: 12px;
            background: var(--key-bg);
            border: 1px solid var(--border-active);
            border-radius: 4px;
            color: var(--text-main);
            padding: 4px;
        }

        .btn {
            background: var(--btn-bg);
            border: none;
            border-radius: 6px;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.45);
            /* 确保文字上下完美对齐 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.6);
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 游戏渲染区 */
        .stage {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI层覆盖 */
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .hud-item {
            background: var(--hud-bg);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-sub);
            font-family: monospace;
            font-size: 16px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.45);
        }

        .score-val { color: var(--text-score); font-weight: bold; }
        .combo-val { color: var(--text-combo); font-weight: bold; }

        /* 判定字样动画效果 */
        .judge-display {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-shadow: 0 0 10px currentColor, 2px 2px 0px #000;
        }

        @keyframes judgePopup {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            10% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(0.9); opacity: 0; }
        }

        .judge-perfect { color: var(--text-perfect); animation: judgePopup 0.4s ease-out forwards; }
        .judge-great { color: var(--text-great); animation: judgePopup 0.4s ease-out forwards; }
        .judge-good { color: var(--text-good); animation: judgePopup 0.4s ease-out forwards; }
        .judge-miss { color: var(--text-miss); animation: judgePopup 0.4s ease-out forwards; }

        /* FC/AP 动画特效 */
        .fc-ap-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            white-space: nowrap;
            padding: 0 20px; /* 增加水平内边距，防止斜体超出裁切边界被截断 */
            background: linear-gradient(90deg, #ff5e5e, #ffb347, #ffde59, #85e085, #4ecdc4, #c9a0dc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }

        @keyframes fcApPopup {
            0% { transform: translate(-50%, -30%); opacity: 0; }
            15% { transform: translate(-50%, -50%); opacity: 1; filter: drop-shadow(0 0 20px rgba(255,255,255,1)); }
            85% { transform: translate(-50%, -60%); opacity: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }
            100% { transform: translate(-50%, -70%); opacity: 0; }
        }

        /* 底部键位提示 */
        .key-hints {
            display: flex;
            width: 100%;
            background: var(--key-bg);
            border-top: 2px solid var(--border-main);
            height: 45px;
        }

        .key-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border-right: 1px solid var(--border-sub);
            color: var(--border-active);
        }
        .key-box:last-child { border-right: none; }

        .key-box.active {
            background: var(--border-sub);
            color: var(--text-main);
            text-shadow: 0 0 8px #fff;
        }

        /* 遮罩/开始界面 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 24px;
            color: var(--text-perfect);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
        }

        .overlay p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .shortcut-info {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-sub);
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-combo);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.45);
        }

        /* 结算界面统计样式 */
        .result-stats {
            background: var(--card-bg);
            border: 2px solid var(--border-sub);
            border-radius: 10px;
            padding: 20px;
            font-size: 16px;
            text-align: left;
            line-height: 2;
            width: 100%;
            max-width: 300px;
            color: var(--text-main);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }
        .result-stats div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-stats span:last-child {
            font-weight: bold;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 18px;
            min-width: 80px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 移动端全屏适配 */
        @media (max-width: 600px) {
            .game-container {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: none;
                border: none;
                border-radius: 0;
            }
            .key-hints { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="stars"></div>

    <div class="game-container">
        <!-- 顶部控制与自定义上传配置面板 -->
        <div class="config-panel">
            <div class="config-row" style="justify-content: center; gap: 15px;">
                <button id="btnBackToMenu" class="btn" data-i18n="backToMenu">返回选歌</button>
                <button id="btnPlayPause" class="btn" disabled data-i18n="waiting">等待加载...</button>
            </div>

            <!-- 结算界面遮罩层 -->
            <div id="resultOverlay" class="overlay hidden">
                <h2 data-i18n="gameOver" style="margin-bottom: 5px;">游戏结束</h2>
                <div id="resAutoPlayLabel" style="display: none; color: var(--text-perfect); margin-bottom: 15px; font-weight: bold; font-size: 14px;" data-i18n="autoPlayMode">自动演奏模式</div>
                <div class="result-stats">
                    <div><span data-i18n="score">得分: </span><span id="resScore">0</span></div>
                    <div><span data-i18n="maxCombo">最大连击: </span><span id="resCombo">0</span></div>
                    <hr style="border-color: var(--border-sub); margin: 10px 0;">
                    <div style="color: var(--text-perfect);">PERFECT: <span id="resPerfect">0</span></div>
                    <div style="color: var(--text-great);">GREAT: <span id="resGreat">0</span></div>
                    <div style="color: var(--text-good);">GOOD: <span id="resGood">0</span></div>
                    <div style="color: var(--text-miss);">MISS: <span id="resMiss">0</span></div>
                </div>
                <button id="btnResultBack" class="btn" style="margin-top: 20px; padding: 10px 30px; font-size: 16px;" data-i18n="backToMenu">返回选歌</button>
            </div>
        </div>

        <!-- 游戏舞台 -->
        <div class="stage" id="stageContainer">
            <div class="hud">
                <div class="hud-item">SCORE: <span id="scoreText" class="score-val">000000</span></div>
                <div class="hud-item">COMBO: <span id="comboText" class="combo-val">0</span></div>
            </div>

            <!-- 动态判定提示 -->
            <div id="judgeDisplay" class="judge-display">PERFECT</div>

            <!-- 增加全连/全P判定特效 -->
            <div id="fcApDisplay" class="fc-ap-display" style="display: none;">FULL COMBO</div>

            <canvas id="gameCanvas"></canvas>

            <!-- 开始/就绪遮罩层 -->
            <div id="startOverlay" class="overlay" style="padding: 20px;">
                <h2 id="readyTitle" data-i18n="waiting">等待加载...</h2>
            </div>
        </div>

        <!-- 底部物理键盘同步高亮指示 -->
        <div class="key-hints">
            <div class="key-box" id="key0">S</div>
            <div class="key-box" id="key1">D</div>
            <div class="key-box" id="key2">J</div>
            <div class="key-box" id="key3">K</div>
        </div>
    </div>

    <script>
        // --- 国际化 (i18n) 字典与逻辑 ---
        const i18n = {
            zh: {
                backToMenu: "返回选歌",
                waiting: "等待加载...",
                gameOver: "游戏结束",
                score: "得分: ",
                maxCombo: "最大连击: ",
                songSelect: "选歌界面",
                loadingSongs: "正在加载歌单和基础资源...",
                language: "语言 / Language:",
                selectSong: "请选择歌曲",
                loadFailed: "加载失败",
                decoding: "解码中...",
                resume: "继续游戏",
                pause: "暂停游戏",
                autoPlayMode: "自动演奏模式"
            },
            en: {
                backToMenu: "Back to Menu",
                waiting: "Loading...",
                gameOver: "Game Over",
                score: "Score: ",
                maxCombo: "Max Combo: ",
                songSelect: "Select Song",
                loadingSongs: "Loading songs and resources...",
                language: "Language / 语言:",
                selectSong: "Select a song",
                loadFailed: "Load Failed",
                decoding: "Decoding...",
                resume: "Resume",
                pause: "Pause",
                autoPlayMode: "AutoPlay Mode"
            }
        };

        let currentLang = localStorage.getItem('slime_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
        
        function t(key) { return i18n[currentLang][key] || key; }

        function updateUIi18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
            });
            document.getElementById('btnLangToggle').textContent = currentLang === 'zh' ? '简体中文' : 'English';
            
            // 更新动态状态文本
            if (isPlaying) {
                btnPlayPause.textContent = t('pause');
            } else if (isSongEnding) {
                btnPlayPause.textContent = t('gameOver');
            } else {
                btnPlayPause.textContent = t('resume');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUIi18n();
        });

        // --- 核心配置与全局状态 ---
        let themeHueOffset = 0;
        let isLightMode = false;
        let slimeScaleFactor = 1.0;
        const PUNCH_KEYS = ['s', 'd', 'j', 'k'];
        const JUDGE_WINDOWS = {
            PERFECT: 50, // 毫秒级正负差
            GREAT: 100,
            GOOD: 150
        };

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        const LANE_COLORS = ['#ff9800', '#4caf50', '#9c27b0', '#00bcd4']; // 恢复橙、绿、紫、蓝
        function updateThemeColors() {
            // 预留钩子：按钮和底层网格已经通过CSS变量随主题变化，如果未来有额外元素需要随主色调更新可放在这里
        }

        let chartNotes = []; // 存储解析后的谱面音符数据
        let timingPoints = []; // 存储所有的BPM变速节点
        let loadedAudioBuffer = null;
        let audioContext = null;
        let audioSource = null;
        let startTime = 0;   // 音乐开始播放的绝对时间戳 (Context时间)
        let isPlaying = false;
        let pauseOffset = 0; // 暂停时的音乐进度位移 (秒)
        let audioOffsetMs = 0; // 音频延迟校准偏移 (毫秒)
        
        // 实时游戏状态
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let activeKeys = [false, false, false, false];
        let hitEffects = []; // 存储打击特效粒子
        let laneGlows = [0, 0, 0, 0]; // 轨道发光特效透明度
        let judgments = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 };
        let isSongEnding = false;
        let songEndingTimeout = null;
        let fcApShown = false;
        let holdAudioSources = [null, null, null, null]; // 存储长按音效循环源
        
        let isAutoPlay = localStorage.getItem('slime_autoPlay') === 'true';
        let autoPlayKeyTimers = [0, 0, 0, 0]; // 自动打歌的按键视觉保持时长控制

        // 新增：全局音量控制节点
        let musicGainNode = null;
        let sfxGainNode = null;
        let customSlimeImages = [null, null, null, null]; // 存储自定义史莱姆图片对象

        // DOM 元素获取
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnBackToMenu = document.getElementById('btnBackToMenu');
        const startOverlay = document.getElementById('startOverlay');
        const scoreText = document.getElementById('scoreText');
        const comboText = document.getElementById('comboText');
        const judgeDisplay = document.getElementById('judgeDisplay');

        // --- 加载本地存储的配置 ---
        function loadLocalSettings() {
            // 亮暗模式
            const savedLightMode = localStorage.getItem('slime_lightMode');
            if (savedLightMode === 'true') {
                isLightMode = true;
                document.body.classList.add('light-mode');
            }
            // 主色调
            const savedHue = localStorage.getItem('slime_hue');
            if (savedHue !== null) {
                themeHueOffset = parseInt(savedHue);
                document.documentElement.style.setProperty('--theme-hue', savedHue + 'deg');
            }
            // 图案缩放比例
            const savedSlimeScale = localStorage.getItem('slime_scale');
            if (savedSlimeScale !== null) {
                slimeScaleFactor = parseInt(savedSlimeScale) / 100;
            }
            // 音频偏移校准
            const savedAudioOffset = localStorage.getItem('slime_audioOffset');
            if (savedAudioOffset !== null) {
                audioOffsetMs = parseInt(savedAudioOffset);
            }
            // 自定义图片
            for (let i = 0; i < 4; i++) {
                const savedImg = localStorage.getItem('slime_customImg' + i);
                if (savedImg) {
                    const img = new Image();
                    img.onload = () => { customSlimeImages[i] = img; };
                img.onerror = () => {
                    console.warn("无法加载保存的皮肤图片，可能已被移除或路径错误:", savedImg);
                    localStorage.removeItem('slime_customImg' + i);
                };
                    img.src = savedImg;
                }
            }
            updateThemeColors();
        }
        loadLocalSettings(); // 页面加载即初始化所有设置与颜色

        // --- 画面初始化与尺寸自适应 ---
        let stageWidth = 0;
        let stageHeight = 0;

        function resizeCanvas() {
            const container = document.getElementById('stageContainer');
            const dpr = window.devicePixelRatio || 1;
            stageWidth = container.clientWidth;
            stageHeight = container.clientHeight;
            
            canvas.width = stageWidth * dpr;
            canvas.height = stageHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 音频系统核心逻辑 ---
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                musicGainNode = audioContext.createGain();
                sfxGainNode = audioContext.createGain();
                
                const musicVol = localStorage.getItem('slime_musicVol') !== null ? localStorage.getItem('slime_musicVol') : 50;
                const sfxVol = localStorage.getItem('slime_sfxVol') !== null ? localStorage.getItem('slime_sfxVol') : 30;
                
                musicGainNode.gain.value = parseInt(musicVol) / 100;
                sfxGainNode.gain.value = parseInt(sfxVol) / 100;
                
                musicGainNode.connect(audioContext.destination);
                sfxGainNode.connect(audioContext.destination);
            }
        }

        let audioArrayBuffers = {};
        let sfxBuffers = {
            perfect: null,
            great: null,
            good: null,
            empty: null,
            long: null,
            all_perfect: null,
            full_combo: null,
            clear: null
        };

        const DB_NAME = 'SlimeRhythmGameDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'custom_songs';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getCustomSong(id) {
            return openDB().then(db => {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.onerror);
                });
            });
        }

        async function getCustomSongAudioArrayBuffer(audioFile) {
            const id = parseInt(audioFile.substring(3));
            const song = await getCustomSong(id);
            if (!song || !song.audio) throw new Error("Audio not found in IndexedDB");
            if (song.audio instanceof Blob) {
                return await song.audio.arrayBuffer();
            } else if (typeof song.audio === 'string' && song.audio.startsWith('data:')) {
                const res = await fetch(song.audio);
                return await res.arrayBuffer();
            } else {
                throw new Error("Unsupported audio storage type");
            }
        }

        async function getCustomSongChart(chartFile) {
            const parts = chartFile.split(':');
            const id = parseInt(parts[1]);
            const levelIdx = parseInt(parts[2]);
            const song = await getCustomSong(id);
            if (!song || !song.levels || !song.levels[levelIdx]) throw new Error("Chart not found in IndexedDB");
            const chartData = song.levels[levelIdx].chart;
            if (typeof chartData === 'string') {
                return JSON.parse(chartData);
            }
            return chartData;
        }

        async function fetchAudioAsArrayBuffer(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.arrayBuffer();
            } catch (e) {
                console.warn('音效加载失败:', url);
                return null;
            }
        }

        async function fetchInitialResources() {
            const params = new URLSearchParams(window.location.search);
            const audioFile = params.get('audio');
            const chartFile = params.get('chart');

            if (!audioFile || !chartFile) {
                alert(t('selectSong') || "请先选择歌曲");
                window.location.href = 'index.html';
                return;
            }

            try {
                // 并行加载基础音效和数据 (此时并不直接解码音频，等待用户点击)
                const sfxPromises = [
                    fetchAudioAsArrayBuffer('sfx/perfect.mp3').then(b => audioArrayBuffers.perfect = b),
                    fetchAudioAsArrayBuffer('sfx/great.mp3').then(b => audioArrayBuffers.great = b),
                    fetchAudioAsArrayBuffer('sfx/good.mp3').then(b => audioArrayBuffers.good = b),
                    fetchAudioAsArrayBuffer('sfx/empty.mp3').then(b => audioArrayBuffers.empty = b),
                    fetchAudioAsArrayBuffer('sfx/long.mp3').then(b => audioArrayBuffers.long = b),
                    fetchAudioAsArrayBuffer('sfx/all_perfect.mp3').then(b => audioArrayBuffers.all_perfect = b),
                    fetchAudioAsArrayBuffer('sfx/full_combo.mp3').then(b => audioArrayBuffers.full_combo = b),
                    fetchAudioAsArrayBuffer('sfx/clear.mp3').then(b => audioArrayBuffers.clear = b)
                ];
                
                let chartPromise;
                if (chartFile.startsWith('db:')) {
                    chartPromise = getCustomSongChart(chartFile);
                } else if (chartFile.startsWith('local:')) {
                    chartPromise = Promise.resolve(JSON.parse(localStorage.getItem(chartFile.substring(6))));
                } else {
                    chartPromise = fetch(chartFile).then(res => res.json());
                }

                let audioPromise;
                if (audioFile.startsWith('db:')) {
                    audioPromise = getCustomSongAudioArrayBuffer(audioFile);
                } else {
                    audioPromise = fetchAudioAsArrayBuffer(audioFile);
                }

                await Promise.all([
                    ...sfxPromises,
                    chartPromise.then(data => loadChartData(data)),
                    audioPromise.then(b => audioArrayBuffers.music = b)
                ]);

                document.getElementById('readyTitle').textContent = t('decoding') || "解码中...";
                
                initAudio(); // 初始化 Web Audio API 上下文

                sfxBuffers.perfect = await decodeAudioSafe(audioArrayBuffers.perfect);
                sfxBuffers.great = await decodeAudioSafe(audioArrayBuffers.great);
                sfxBuffers.good = await decodeAudioSafe(audioArrayBuffers.good);
                sfxBuffers.empty = await decodeAudioSafe(audioArrayBuffers.empty);
                sfxBuffers.long = await decodeAudioSafe(audioArrayBuffers.long);
                sfxBuffers.all_perfect = await decodeAudioSafe(audioArrayBuffers.all_perfect);
                sfxBuffers.full_combo = await decodeAudioSafe(audioArrayBuffers.full_combo);
                sfxBuffers.clear = await decodeAudioSafe(audioArrayBuffers.clear);
                
                loadedAudioBuffer = await decodeAudioSafe(audioArrayBuffers.music);
                
                startGameDirectly();

                // 检查 AudioContext 是否因为浏览器的自动播放策略而被暂停
                if (audioContext.state === 'suspended') {
                    document.getElementById('readyTitle').innerHTML = '<span style="font-size:24px; cursor:pointer;">' + (currentLang === 'zh' ? '点击屏幕任意位置开始' : 'Tap anywhere to start') + '</span>';
                    const resumeAndStart = () => {
                        audioContext.resume().then(() => document.getElementById('startOverlay').classList.add('hidden'));
                        document.removeEventListener('click', resumeAndStart);
                        document.removeEventListener('touchstart', resumeAndStart);
                    };
                    document.addEventListener('click', resumeAndStart);
                    document.addEventListener('touchstart', resumeAndStart);
                } else {
                    document.getElementById('startOverlay').classList.add('hidden');
                }
            } catch (err) {
                console.error("加载资源失败:", err);
                document.getElementById('readyTitle').innerHTML = `<span style="color:#ff4444">${t('loadFailed')}: ${err.message}</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', fetchInitialResources);

        function resetGameState() {
            score = 0;
            combo = 0;
            maxCombo = 0;
            hitEffects = [];
            laneGlows = [0, 0, 0, 0];
            activeKeys = [false, false, false, false];
            judgments = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 };
            
            if (songEndingTimeout) {
                clearTimeout(songEndingTimeout);
                songEndingTimeout = null;
            }
            isSongEnding = false;
            fcApShown = false;
            for (let i = 0; i < 4; i++) stopHoldSfx(i);
            document.getElementById('fcApDisplay').style.display = 'none';

            document.querySelectorAll('.key-box').forEach(el => el.classList.remove('active'));
            updateHUD();
            judgeDisplay.className = 'judge-display'; // 重置判定UI
        }

        // --- 变速谱面：时间与节拍映射核心 ---
        function processTimingPoints(chartObj) {
            let baseBpm = chartObj.bpm || 120;
            let list = chartObj.bpmList || [{ beat: 0, bpm: baseBpm }];
            list.sort((a, b) => a.beat - b.beat);
            
            timingPoints = [];
            let currentTime = 0;
            
            for (let i = 0; i < list.length; i++) {
                let tp = list[i];
                if (i > 0) {
                    let prevTp = timingPoints[i - 1];
                    let beatsDiff = tp.beat - prevTp.beat;
                    let msPerBeat = 60000 / prevTp.bpm;
                    currentTime += beatsDiff * msPerBeat;
                }
                timingPoints.push({ beat: tp.beat, bpm: tp.bpm, timeMs: currentTime });
            }
        }

        function beatToTime(beat) {
            if (timingPoints.length === 0) return beat * (60000 / 120);
            let tp = timingPoints[0];
            for (let i = timingPoints.length - 1; i >= 0; i--) {
                if (beat >= timingPoints[i].beat) {
                    tp = timingPoints[i];
                    break;
                }
            }
            let beatsDiff = beat - tp.beat;
            let msPerBeat = 60000 / tp.bpm;
            return tp.timeMs + beatsDiff * msPerBeat;
        }

        function timeToBeat(timeMs) {
            if (timingPoints.length === 0) return timeMs / (60000 / 120);
            let tp = timingPoints[0];
            // 时间在第一个节点之前（比如开局等待时间）
            if (timeMs < tp.timeMs) {
                let msPerBeat = 60000 / tp.bpm;
                return tp.beat + (timeMs - tp.timeMs) / msPerBeat;
            }
            for (let i = timingPoints.length - 1; i >= 0; i--) {
                if (timeMs >= timingPoints[i].timeMs) {
                    tp = timingPoints[i];
                    break;
                }
            }
            let timeDiff = timeMs - tp.timeMs;
            let msPerBeat = 60000 / tp.bpm;
            return tp.beat + timeDiff / msPerBeat;
        }

        function loadChartData(chartObj) {
            processTimingPoints(chartObj);

            // 计算每个音符达到判定线的绝对目标毫秒时间戳
            chartNotes = chartObj.notes.map((n, idx) => {
                return {
                    id: idx,
                    beat: n.beat,
                    endBeat: n.endBeat,
                    lane: n.lane,
                    timeMs: beatToTime(n.beat),
                    endTimeMs: n.endBeat ? beatToTime(n.endBeat) : null,
                    hitState: 0, // 0:未处理, 1:Perfect, 2:Good, 3:Miss, 4:Great, 5:Holding
                    startHitType: null // 记录按下的最初判定级别
                };
            }).sort((a, b) => a.timeMs - b.timeMs);
            
            resetGameState();
        }

        // 统一控制开关
        function togglePlay() {
            if (!loadedAudioBuffer || chartNotes.length === 0) {
                alert(currentLang === 'zh' ? "请先确保音乐和谱面数据加载完毕！" : "Please ensure music and chart data are loaded!");
                return;
            }

            if (isPlaying) {
                // 暂停游戏
                pauseOffset = audioContext.currentTime - startTime;
                if (audioSource) {
                    audioSource.stop();
                    audioSource.disconnect();
                    audioSource = null;
                }
                for (let i = 0; i < 4; i++) stopHoldSfx(i);
                isPlaying = false;
                btnPlayPause.textContent = t('resume');
            } else {
                // 开始/继续游戏
                initAudio();
                audioSource = audioContext.createBufferSource();
                audioSource.buffer = loadedAudioBuffer;
                audioSource.connect(musicGainNode);
                
                startTime = audioContext.currentTime - pauseOffset;
                
                if (pauseOffset < 0) {
                    audioSource.start(startTime); // 如果还在开局等待阶段，在未来播放
                } else {
                    audioSource.start(0, pauseOffset); // 否则立即从偏移处播放
                }
                isPlaying = true;
                btnPlayPause.textContent = t('pause');
                
                // 开启主循环渲染
                requestAnimationFrame(gameLoop);
            }
        }

        btnPlayPause.addEventListener('click', togglePlay);
        
        function decodeAudioSafe(buffer) {
            return new Promise((resolve) => {
                if (!buffer) { resolve(null); return; }
                audioContext.decodeAudioData(buffer, resolve, () => resolve(null));
            });
        }

        function startGameDirectly() {
            if (audioSource) {
                audioSource.stop();
                audioSource.disconnect();
            }
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = loadedAudioBuffer;
            audioSource.connect(musicGainNode);
            
            const initialBpm = timingPoints.length > 0 ? timingPoints[0].bpm : 120;
            const delaySec = (60 / initialBpm) * 4;
            pauseOffset = -delaySec; // 重置暂停位移（负数代表需要等待的节拍时间）
            startTime = audioContext.currentTime - pauseOffset;
            audioSource.start(startTime); // 在未来指定时间播放音频
            isPlaying = true;
            btnPlayPause.disabled = false;
            btnPlayPause.textContent = t('pause');
            
            requestAnimationFrame(gameLoop);
        }

        function showResultScreen() {
            isPlaying = false;
            if (audioSource) {
                audioSource.stop();
                audioSource.disconnect();
                audioSource = null;
            }
            for (let i = 0; i < 4; i++) stopHoldSfx(i);
            btnPlayPause.textContent = t('gameOver');
            btnPlayPause.disabled = true;
            
            document.getElementById('resScore').textContent = scoreText.textContent;
            document.getElementById('resCombo').textContent = maxCombo;
            document.getElementById('resPerfect').textContent = judgments.PERFECT;
            document.getElementById('resGreat').textContent = judgments.GREAT;
            document.getElementById('resGood').textContent = judgments.GOOD;
            document.getElementById('resMiss').textContent = judgments.MISS;
            
            if (isAutoPlay) {
                document.getElementById('resAutoPlayLabel').style.display = 'block';
            } else {
                document.getElementById('resAutoPlayLabel').style.display = 'none';
            }
            
            document.getElementById('resultOverlay').classList.remove('hidden');
            btnBackToMenu.style.display = 'none';
            document.getElementById('fcApDisplay').style.display = 'none';
        }

        document.getElementById('btnResultBack').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // 返回选歌界面逻辑
        btnBackToMenu.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // --- 移动端触摸映射绑定 (以底部的静止史莱姆区域作为按键) ---
        const activeTouches = new Map();

        function getLaneFromTouch(touch) {
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            const w = rect.width;
            
            // 为了体验更好，限制只能触摸画布中下部（也就是静止史莱姆所在区域），防止误触顶部UI
            if (y < rect.height * 0.4) return -1;
            if (x < 0 || x >= w) return -1;
            
            // 根据 X 坐标判断落在哪一个轨道 (四等分)
            return Math.floor(x / (w / 4));
        }

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault(); // 阻止移动端默认的滚动/长按行为
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const lane = getLaneFromTouch(touch);
                if (lane >= 0 && lane <= 3) {
                    activeTouches.set(touch.identifier, lane);
                    if (!activeKeys[lane]) {
                        activeKeys[lane] = true;
                        const keyEl = document.getElementById('key' + lane);
                        if (keyEl) keyEl.classList.add('active');
                        judgeHit(lane);
                    }
                }
            }
        }, { passive: false });

        const handleTouchEnd = function(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (activeTouches.has(touch.identifier)) {
                    const lane = activeTouches.get(touch.identifier);
                    activeTouches.delete(touch.identifier);
                    
                    // 检查是否还有其他手指按在同一个轨道上，如果没有则松开该轨道
                    let stillPressed = Array.from(activeTouches.values()).includes(lane);
                    if (!stillPressed) {
                        activeKeys[lane] = false;
                        const keyEl = document.getElementById('key' + lane);
                        if (keyEl) keyEl.classList.remove('active');
                        releaseHold(lane);
                    }
                }
            }
        };

        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        // --- 长按释放逻辑 ---
        function releaseHold(laneIndex) {
            if (!isPlaying) return;
            const currentMs = (audioContext.currentTime - startTime) * 1000 + audioOffsetMs;
            const targetNote = chartNotes.find(n => n.lane === laneIndex && n.hitState === 5); // 寻找正在Holding的音符
            
            if (targetNote) {
                const diff = targetNote.endTimeMs - currentMs;
                if (diff > JUDGE_WINDOWS.GOOD) {
                    // 松开太早了，判定为Miss/断连
                    stopHoldSfx(laneIndex);
                    targetNote.hitState = 3; 
                    combo = 0;
                    triggerJudgeUI('MISS', 'judge-miss');
                    judgments.MISS++;
                    updateHUD();
                } else {
                    // 正常在判定区间内提前一点点松开也算完成
                    finishHold(targetNote);
                }
            }
        }

        // 完成长按逻辑
        function finishHold(targetNote) {
            stopHoldSfx(targetNote.lane);
            targetNote.hitState = targetNote.startHitType === 'PERFECT' ? 1 : (targetNote.startHitType === 'GREAT' ? 4 : 2);
            // 加上长按释放时的尾部分数
            score += targetNote.startHitType === 'PERFECT' ? 500 : (targetNote.startHitType === 'GREAT' ? 400 : 250);
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            
            const uiClass = targetNote.startHitType === 'PERFECT' ? 'judge-perfect' : (targetNote.startHitType === 'GREAT' ? 'judge-great' : 'judge-good');
            triggerJudgeUI(targetNote.startHitType, uiClass);
            createSparks(targetNote.lane, LANE_COLORS[targetNote.lane]);
            laneGlows[targetNote.lane] = 1.0;
            judgments[targetNote.startHitType]++;
            updateHUD();

            if (targetNote.startHitType === 'PERFECT') { playSfx(sfxBuffers.perfect); triggerVibrate(); }
            else if (targetNote.startHitType === 'GREAT') { playSfx(sfxBuffers.great); triggerVibrate(); }
            else if (targetNote.startHitType === 'GOOD') { playSfx(sfxBuffers.good); triggerVibrate(); }
        }

        // --- 音效与震动辅助函数 ---
        let lastHitSfxTime = 0;

        function playSfx(buffer) {
            if (!buffer || !audioContext) return;
            
            const now = audioContext.currentTime;
            // 防止双押、多押或相近时间触发导致音效重叠放大、产生相位刺耳声 (30ms内只响一次)
            if (now - lastHitSfxTime < 0.03) return;
            lastHitSfxTime = now;

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(sfxGainNode);
            source.start(0);
        }

        function playHoldSfx(lane) {
            if (!sfxBuffers.long || !audioContext) return;
            stopHoldSfx(lane);
            const source = audioContext.createBufferSource();
            source.buffer = sfxBuffers.long;
            source.loop = true; // 开启循环播放
            source.connect(sfxGainNode);
            source.start(0);
            holdAudioSources[lane] = source;
        }

        function stopHoldSfx(lane) {
            if (holdAudioSources[lane]) {
                try { holdAudioSources[lane].stop(); } catch(e) {}
                holdAudioSources[lane].disconnect();
                holdAudioSources[lane] = null;
            }
        }

        function triggerVibrate() {
            if (navigator.vibrate) {
                navigator.vibrate(50); 
            }
        }

        // --- 核心判定逻辑 ---
        function judgeHit(laneIndex) {
            if (!isPlaying) return;
            
            const currentMs = (audioContext.currentTime - startTime) * 1000 + audioOffsetMs;
            const targetNote = chartNotes.find(n => n.lane === laneIndex && n.hitState === 0);
            
            let hitType = 'EMPTY';
            let actualAudioHitType = 'EMPTY';

            if (targetNote) {
                const diff = currentMs - targetNote.timeMs;
                if (Math.abs(diff) <= JUDGE_WINDOWS.GOOD) {
                    if (Math.abs(diff) <= JUDGE_WINDOWS.PERFECT) {
                        hitType = 'PERFECT';
                    } else if (Math.abs(diff) <= JUDGE_WINDOWS.GREAT) {
                        hitType = 'GREAT';
                    } else {
                        hitType = 'GOOD';
                    }
                    
                    actualAudioHitType = hitType;

                    // 判断是否为长按音符
                    if (targetNote.endTimeMs) {
                        targetNote.hitState = 5; // 标记为正在长按
                        targetNote.startHitType = hitType;
                        score += (hitType === 'PERFECT' ? 500 : (hitType === 'GREAT' ? 400 : 250)); // 起始时先给一半分
                        triggerJudgeUI('HOLD', 'judge-perfect');
                        createSparks(laneIndex, LANE_COLORS[laneIndex]);
                        laneGlows[laneIndex] = 1.0;
                        playHoldSfx(laneIndex);
                    } else {
                        // 普通音符直接结算
                        targetNote.hitState = hitType === 'PERFECT' ? 1 : (hitType === 'GREAT' ? 4 : 2);
                        score += (hitType === 'PERFECT' ? 1000 : (hitType === 'GREAT' ? 800 : 500));
                        combo++;
                        triggerJudgeUI(hitType, hitType === 'PERFECT' ? 'judge-perfect' : (hitType === 'GREAT' ? 'judge-great' : 'judge-good'));
                        createSparks(laneIndex, hitType === 'PERFECT' ? '#ffcc00' : (hitType === 'GREAT' ? '#00ccff' : '#a3ff66'));
                        laneGlows[laneIndex] = 1.0;
                        judgments[actualAudioHitType]++;
                        if (combo > maxCombo) maxCombo = combo;
                    }
                    
                    updateHUD();
                }
            }

            if (actualAudioHitType === 'PERFECT') {
                playSfx(sfxBuffers.perfect);
                triggerVibrate();
            } else if (actualAudioHitType === 'GREAT') {
                playSfx(sfxBuffers.great);
                triggerVibrate();
            } else if (actualAudioHitType === 'GOOD') {
                playSfx(sfxBuffers.good);
                triggerVibrate();
            } else {
                playSfx(sfxBuffers.empty);
            }
        }

        // 触发文字判定飘字
        function triggerJudgeUI(txt, className) {
            judgeDisplay.textContent = txt;
            judgeDisplay.className = 'judge-display ' + className;
            // 强制重新渲染引发CSS动画重新执行
            judgeDisplay.style.animation = 'none';
            judgeDisplay.offsetHeight; 
            judgeDisplay.style.animation = null;
        }

        function updateHUD() {
            scoreText.textContent = String(score).padStart(6, '0');
            comboText.textContent = combo;
        }

        // --- 键盘与高亮映射绑定 ---
        window.addEventListener('keydown', function(e) {
            const keyIdx = PUNCH_KEYS.indexOf(e.key.toLowerCase());
            if (keyIdx !== -1 && !activeKeys[keyIdx]) {
                activeKeys[keyIdx] = true;
                document.getElementById('key' + keyIdx).classList.add('active');
                judgeHit(keyIdx);
            }
        });

        window.addEventListener('keyup', function(e) {
            const keyIdx = PUNCH_KEYS.indexOf(e.key.toLowerCase());
            if (keyIdx !== -1) {
                activeKeys[keyIdx] = false;
                document.getElementById('key' + keyIdx).classList.remove('active');
                releaseHold(keyIdx);
            }
        });

        // --- 特效粒子机制 ---
        function createSparks(lane, color) {
            const x = getLaneBottomX(lane);
            const y = stageHeight * 0.85; // 判定线高度
            for (let i = 0; i < 30; i++) {
                hitEffects.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.9) * 20,
                    radius: Math.random() * 6 + 3,
                    color: color,
                    alpha: 1,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function updateAndDrawEffects() {
            if (hitEffects.length === 0) return;
            
            ctx.save();
            // 开启屏幕叠加混合模式
            ctx.globalCompositeOperation = 'screen';
            
            for (let i = hitEffects.length - 1; i >= 0; i--) {
                const p = hitEffects[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.6; // 增加重力感
                p.life -= p.decay;
                if (p.life <= 0) {
                    hitEffects.splice(i, 1);
                    continue;
                }
                
                const alpha = Math.max(0, p.life);
                const r = Math.max(0, p.radius * p.life);
                
                // 1. 绘制核心实体
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
                
                // 2. 绘制透明度更低、面积更大的外围圆圈来“伪造”光晕效果
                ctx.globalAlpha = alpha * 0.3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        // --- 画面二维/三维透视投射计算 ---
        // 游戏核心规则：每个音符在每拍移动1格。这里设定可见轨道纵深跨度为8个拍子(Grid)。
        const VISIBLE_BEATS = 8; 

        // 获取轨道在底部（判定线）处的中心X坐标
        function getLaneBottomX(laneIdx) {
            const laneWidth = stageWidth / 4;
            return laneWidth * laneIdx + laneWidth / 2;
        }

        // 3D透视投影函数：根据音符距离判定线的“剩余拍数”计算屏幕(X, Y)坐标
        // remBeats: 剩余多少拍到达判定线。 4表示刚出现在最顶部，0表示正好到达判定线。
        function projectPerspective(laneIdx, remBeats) {
            const w = stageWidth;
            const h = stageHeight;

            // 建立经典梯形透视。顶端消失点收缩比例，底端完全展开
            const vanishingY = h * 0.1;   // 消失点Y坐标
            const judgeY = h * 0.85;       // 判定线Y坐标
            
            // 将剩余拍数归一化[0, 1]，0代表已到判定线，1代表位于轨道最深处(顶端)
            const progress = Math.max(0, Math.min(1, remBeats / VISIBLE_BEATS));
            
            // 采用 Ease-Out 缓出插值，模拟真实的 3D 近大远小透视
            // 越靠近判定线 (progress接近0)，在屏幕上的高度跨度越大
            const t = 1 - Math.pow(1 - progress, 2); 
            
            // 算出当前的Y轴像素位置
            const y = judgeY - (judgeY - vanishingY) * t;
            
            // 计算当前深度下的轨道水平缩放权重
            const topScale = 0.25; // 轨道顶部的宽度是底部的1/4
            const currentScale = topScale + (1 - topScale) * (1 - t);
            
            // 计算基准X位置
            const bottomX = getLaneBottomX(laneIdx);
            const centerX = w / 2;
            const x = centerX + (bottomX - centerX) * currentScale;
            
            // 顺便算出一个随视距缩放的物体半径尺寸系数
            const sizeFactor = currentScale;

            return { x, y, sizeFactor };
        }

        // 获取轨道边缘用于绘制棋盘格
        function projectPerspectiveEdge(edgeIdx, remBeats) {
            const w = stageWidth;
            const h = stageHeight;
            const vanishingY = h * 0.1;
            const judgeY = h * 0.85;
            const progress = Math.max(0, Math.min(1, remBeats / VISIBLE_BEATS));
            const t = 1 - Math.pow(1 - progress, 2);
            const y = judgeY - (judgeY - vanishingY) * t;
            const topScale = 0.25;
            const currentScale = topScale + (1 - topScale) * (1 - t);
            const bottomX = (w / 4) * edgeIdx;
            const centerX = w / 2;
            const x = centerX + (bottomX - centerX) * currentScale;
            return { x, y };
        }

        // --- 绘制精致拟真史莱姆音符 ---
        function drawSlime(ctx, x, y, radius, color, isReceptor, isMissed=false, keyIsDown=false, currentBeat=0, laneIdx=-1) {
            ctx.save();
            
            // 如果是底部接收器且被按下，产生弹性缩放
            let scaleY = 1.0;
            let scaleX = 1.0;
            if (isReceptor) {
                if (keyIsDown) {
                    scaleY = 0.7; scaleX = 1.25;
                } else {
                    scaleY = 1.0; scaleX = 1.0;
                }
            } else {
                // 下落的音符蠕动动画，改为与自身距离判定线的节拍挂钩
                const pulse = Math.cos(currentBeat * Math.PI * 2) * 0.15;
                scaleX = 1 + pulse;
                scaleY = 1 - pulse;
            }

            ctx.translate(x, y);
            ctx.scale(scaleX, scaleY);

            // 如果当前轨道存在自定义图片，则绘制图片
            if (laneIdx >= 0 && customSlimeImages[laneIdx]) {
                const img = customSlimeImages[laneIdx];
                const imgSize = radius * 2.5; // 基准缩放大小
                
                // 计算保持原有宽高比的实际绘制尺寸
                const imgRatio = img.width / img.height;
                let drawWidth = imgSize;
                let drawHeight = imgSize;
                if (imgRatio > 1) {
                    drawHeight = imgSize / imgRatio; // 宽图，压扁高度
                } else {
                    drawWidth = imgSize * imgRatio;  // 长图，收缩宽度
                }
                
                ctx.globalAlpha = isMissed ? 0.3 : 1.0;
                if (isMissed) ctx.filter = 'grayscale(100%)'; // 失误时图片置灰
                
                ctx.shadowBlur = isReceptor ? 20 : 12;
                ctx.shadowColor = color;
                ctx.drawImage(img, -drawWidth / 2, -drawHeight, drawWidth, drawHeight); // 改为底边贴合网格线绘制
                
                ctx.shadowBlur = 0;
                if (isMissed) ctx.filter = 'none';
                ctx.globalAlpha = 1.0;
            } else {
            // 将原生史莱姆的锚点移到底部中心（原底边偏下大约 radius * 0.9）
            ctx.translate(0, -radius * 0.9);
            // 1. 绘制带有渐变和霓虹外发光的史莱姆身体
            ctx.shadowBlur = isReceptor ? 20 : 12;
            ctx.shadowColor = color;
            
            const gradient = ctx.createRadialGradient(0, -radius*0.2, radius*0.2, 0, 0, radius);
            if (isMissed) {
                gradient.addColorStop(0, '#555');
                gradient.addColorStop(1, '#222');
                ctx.shadowColor = '#333';
            } else {
                gradient.addColorStop(0, '#fff');
                if (isLightMode) {
                    gradient.addColorStop(0.4, adjustColorBurn(color, 25));
                    gradient.addColorStop(1, adjustColorBurn(color, -10));
                } else {
                    gradient.addColorStop(0.3, color);
                    gradient.addColorStop(1, adjustColorBurn(color, -40));
                }
            }
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            
            // 贝塞尔曲线勾勒史莱姆Q弹水滴造型
            ctx.moveTo(-radius, 0);
            ctx.bezierCurveTo(-radius, -radius * 1.1, -radius * 0.6, -radius * 1.3, 0, -radius * 1.3);
            ctx.bezierCurveTo(radius * 0.6, -radius * 1.3, radius, -radius * 1.1, radius, 0);
            ctx.bezierCurveTo(radius, radius * 0.6, radius * 0.7, radius * 0.9, 0, radius * 0.9);
            ctx.bezierCurveTo(-radius * 0.7, radius * 0.9, -radius, radius * 0.6, -radius, 0);
            ctx.closePath();
            ctx.fill();
            
            // 取消阴影防止后续重叠
            ctx.shadowBlur = 0;

            // 2. 绘制可爱多变的五官
            ctx.fillStyle = '#110224';
            if (isMissed) {
                // 哭泣/打叉眼
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                // 左叉
                ctx.beginPath(); ctx.moveTo(-radius*0.4, -radius*0.4); ctx.lineTo(-radius*0.2, -radius*0.2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-radius*0.2, -radius*0.4); ctx.lineTo(-radius*0.4, -radius*0.2); ctx.stroke();
                // 右叉
                ctx.beginPath(); ctx.moveTo(radius*0.2, -radius*0.4); ctx.lineTo(radius*0.4, -radius*0.2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(radius*0.4, -radius*0.4); ctx.lineTo(radius*0.2, -radius*0.2); ctx.stroke();
            } else {
                // 正常Q萌圆眼
                ctx.beginPath();
                ctx.arc(-radius * 0.35, -radius * 0.35, radius * 0.12, 0, Math.PI * 2);
                ctx.arc(radius * 0.35, -radius * 0.35, radius * 0.12, 0, Math.PI * 2);
                ctx.fill();
                
                // 眼部高光点
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-radius * 0.32, -radius * 0.38, radius * 0.04, 0, Math.PI * 2);
                ctx.arc(radius * 0.38, -radius * 0.38, radius * 0.04, 0, Math.PI * 2);
                ctx.fill();
            }

            // 微笑小嘴巴 (波浪 w 嘴型)
            ctx.strokeStyle = '#110224';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            if (isReceptor && !keyIsDown) {
                // 呆萌小圆嘴
                ctx.fillStyle = '#110224';
                ctx.arc(0, -radius*0.1, radius*0.08, 0, Math.PI*2);
                ctx.fill();
            } else {
                // 经典 w 缝
                ctx.arc(-radius*0.08, -radius * 0.15, radius * 0.08, 0, Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(radius*0.08, -radius * 0.15, radius * 0.08, 0, Math.PI);
                ctx.stroke();
            }
            } // 结束 else (未上传图片时的原生绘制)

            ctx.restore();
        }

        // 辅助函数：颜色深浅微调
        function adjustColorBurn(hex, percent) {
            let R = parseInt(hex.substring(1,3),16);
            let G = parseInt(hex.substring(3,5),16);
            let B = parseInt(hex.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
            R = (R>0)?R:0; G = (G>0)?G:0; B = (B>0)?B:0;
            const rHex = (R.toString(16).length==1)?"0"+R.toString(16):R.toString(16);
            const gHex = (G.toString(16).length==1)?"0"+G.toString(16):G.toString(16);
            const bHex = (B.toString(16).length==1)?"0"+B.toString(16):B.toString(16);
            return "#"+rHex+gHex+bHex;
        }

        // 获取平滑或带跳跃感的动画拍数
        function getDisplayRemBeats(noteBeat, currentBeat) {
            const remBeats = noteBeat - currentBeat;
            const floorRem = Math.floor(remBeats);
            const fractionalRem = remBeats - floorRem;
            const transitionDuration = 0.2;
            
            let displayRem = floorRem + 1;
            if (fractionalRem <= transitionDuration) {
                const progress = (transitionDuration - fractionalRem) / transitionDuration;
                displayRem -= 1 - Math.pow(1 - progress, 2);
            }
            
            return Math.max(0, displayRem);
        }

        // --- 主渲染与物理时钟循环 ---
        function gameLoop() {
            if (!isPlaying) return;

            const w = stageWidth;
            const h = stageHeight;
            
            // 清屏
            ctx.clearRect(0, 0, w, h);

            const currentAudioTimeSec = audioContext.currentTime - startTime;
            const currentAudioTimeMs = currentAudioTimeSec * 1000 + audioOffsetMs;

            const currentBeat = timeToBeat(currentAudioTimeMs);

            // --- 新增：自动打歌 (AutoPlay) 核心逻辑 ---
            if (isAutoPlay) {
                chartNotes.forEach(note => {
                    // 自动精准按下
                    if (note.hitState === 0 && currentAudioTimeMs >= note.timeMs) {
                        activeKeys[note.lane] = true;
                        autoPlayKeyTimers[note.lane] = currentAudioTimeMs + 100; // 模拟人类按压保持100ms
                        const keyEl = document.getElementById('key' + note.lane);
                        if (keyEl) keyEl.classList.add('active');
                        judgeHit(note.lane);
                    } 
                    // 自动精准松开长按
                    else if (note.hitState === 5 && currentAudioTimeMs >= note.endTimeMs) {
                        activeKeys[note.lane] = false;
                        const keyEl = document.getElementById('key' + note.lane);
                        if (keyEl) keyEl.classList.remove('active');
                        releaseHold(note.lane);
                    }
                });

                // 自动松开短按的按键状态（带有100ms延时以维持史莱姆被压扁的视觉动画）
                for (let l = 0; l < 4; l++) {
                    const isHolding = chartNotes.some(n => n.lane === l && n.hitState === 5);
                    if (activeKeys[l] && !isHolding && currentAudioTimeMs >= autoPlayKeyTimers[l]) {
                        activeKeys[l] = false;
                        const keyEl = document.getElementById('key' + l);
                        if (keyEl) keyEl.classList.remove('active');
                    }
                }
            }

            // 1. 绘制游戏赛道网格线与透视边界
            ctx.save();
            
            const trackBaseHue = 202; // 原本青蓝色的色相值
            const currentHue = (trackBaseHue + themeHueOffset) % 360;
            const trackL = isLightMode ? 45 : 60; // 在亮色模式下加深轨道颜色，保证清晰度
            
            ctx.strokeStyle = `hsla(${currentHue}, 100%, ${trackL}%, 0.4)`;
            ctx.lineWidth = 2;
            
            const vanishingY = h * 0.1;
            const judgeY = h * 0.85;

            // 绘制静态棋盘赛道
            for (let d = 0; d < VISIBLE_BEATS; d++) {
                for (let l = 0; l < 4; l++) {
                    const pt1 = projectPerspectiveEdge(l, d);
                    const pt2 = projectPerspectiveEdge(l + 1, d);
                    const pt3 = projectPerspectiveEdge(l + 1, d + 1);
                    const pt4 = projectPerspectiveEdge(l, d + 1);
                    
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.lineTo(pt3.x, pt3.y);
                    ctx.lineTo(pt4.x, pt4.y);
                    ctx.closePath();
                    
                    // 一排亮一排暗交替颜色
                    if (d % 2 === 0) {
                        ctx.fillStyle = `hsla(${currentHue}, 100%, ${trackL}%, 0.2)`;
                    } else {
                        ctx.fillStyle = `hsla(${currentHue}, 100%, ${trackL}%, 0.05)`;
                    }
                    ctx.fill();
                    
                    ctx.strokeStyle = `hsla(${currentHue}, 100%, ${trackL}%, 0.4)`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // 绘制核心判定基准线线
            ctx.strokeStyle = `hsla(${currentHue}, 100%, ${trackL}%, 1)`;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `hsla(${currentHue}, 100%, ${trackL}%, 1)`;
            ctx.beginPath();
            ctx.moveTo(0, judgeY);
            ctx.lineTo(w, judgeY);
            ctx.stroke();
            ctx.restore();

            // 绘制轨道高光反馈
            for (let l = 0; l < 4; l++) {
                if (laneGlows[l] > 0) {
                    ctx.save();
                    const ptTopLeft = projectPerspectiveEdge(l, VISIBLE_BEATS);
                    const ptTopRight = projectPerspectiveEdge(l + 1, VISIBLE_BEATS);
                    const ptBottomRight = projectPerspectiveEdge(l + 1, 0);
                    const ptBottomLeft = projectPerspectiveEdge(l, 0);
                    
                    const gradient = ctx.createLinearGradient(0, judgeY, 0, vanishingY);
                    gradient.addColorStop(0, LANE_COLORS[l]);
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.globalAlpha = laneGlows[l] * 0.6; // 控制最大亮度
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.moveTo(ptTopLeft.x, ptTopLeft.y);
                    ctx.lineTo(ptTopRight.x, ptTopRight.y);
                    ctx.lineTo(ptBottomRight.x, ptBottomRight.y);
                    ctx.lineTo(ptBottomLeft.x, ptBottomLeft.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                    laneGlows[l] -= 0.05;
                }
            }

            // 2. 绘制底部的4个静止/弹性史莱姆接收器
            const baseNoteRadius = (w / 12) * slimeScaleFactor;
            for (let l = 0; l < 4; l++) {
                const rx = getLaneBottomX(l);
                drawSlime(ctx, rx, judgeY, baseNoteRadius, LANE_COLORS[l], true, false, activeKeys[l], currentBeat, l);
            }

            // 3. 遍历、更新音符状态，并绘制光轨、收集需要绘制的史莱姆实体
            let slimesToDraw = [];
            for (let i = chartNotes.length - 1; i >= 0; i--) {
                const note = chartNotes[i];
                // 计算该音符距离判定点还剩多少拍
                const remBeats = note.beat - currentBeat;

                // Miss自动触发检测：根据绝对时间差异触发
                if (currentAudioTimeMs - note.timeMs > JUDGE_WINDOWS.GOOD && note.hitState === 0) {
                    note.hitState = 3; // 标记为Miss
                    combo = 0;         // 连击中断
                    triggerJudgeUI('MISS', 'judge-miss');
                    judgments.MISS++;
                    updateHUD();
                }

                // 长按音符如果一直按住直到结束，则自动完成判定
                if (note.hitState === 5 && currentAudioTimeMs >= note.endTimeMs) {
                    finishHold(note);
                }
                
                const displayStart = note.hitState === 5 ? 0 : getDisplayRemBeats(note.beat, currentBeat);
                let displayEnd = null;
                if (note.endBeat) {
                    displayEnd = getDisplayRemBeats(note.endBeat, currentBeat);
                }

                // 绘制长按光轨（拖尾）
                if (note.endBeat && (note.hitState === 0 || note.hitState === 3 || note.hitState === 5)) {
                    if (displayStart <= VISIBLE_BEATS && displayEnd >= 0) {
                        const drawStart = Math.max(0, displayStart);
                        const drawEnd = Math.min(VISIBLE_BEATS, displayEnd);
                        
                        if (drawStart < drawEnd) {
                            ctx.save();
                            const ptBottomLeft = projectPerspectiveEdge(note.lane, drawStart);
                            const ptBottomRight = projectPerspectiveEdge(note.lane + 1, drawStart);
                            const ptTopLeft = projectPerspectiveEdge(note.lane, drawEnd);
                            const ptTopRight = projectPerspectiveEdge(note.lane + 1, drawEnd);

                            // 两边稍微收缩一点，显得更有光束感
                            const widthBottom = ptBottomRight.x - ptBottomLeft.x;
                            const widthTop = ptTopRight.x - ptTopLeft.x;
                            const paddingBottom = widthBottom * 0.25;
                            const paddingTop = widthTop * 0.25;

                            ctx.beginPath();
                            ctx.moveTo(ptBottomLeft.x + paddingBottom, ptBottomLeft.y);
                            ctx.lineTo(ptBottomRight.x - paddingBottom, ptBottomRight.y);
                            ctx.lineTo(ptTopRight.x - paddingTop, ptTopRight.y);
                            ctx.lineTo(ptTopLeft.x + paddingTop, ptTopLeft.y);
                            ctx.closePath();

                            const alpha = note.hitState === 3 ? 0.2 : (note.hitState === 5 ? 0.6 : 0.4);
                            ctx.fillStyle = LANE_COLORS[note.lane];
                            ctx.globalAlpha = alpha;
                            ctx.globalCompositeOperation = 'screen';
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                }

                // 收集音符头部史莱姆实体
                if (displayStart <= VISIBLE_BEATS && remBeats > -1) {
                    if (note.hitState === 0 || note.hitState === 3) {
                        slimesToDraw.push({ lane: note.lane, depth: displayStart, isMissed: note.hitState === 3, scale: 1.0, remBeats: remBeats });
                    }
                }

                // 收集长按音符尾部的史莱姆实体（封顶）
                if (note.endBeat && (note.hitState === 0 || note.hitState === 3 || note.hitState === 5)) {
                    const endRemBeats = note.endBeat - currentBeat;
                    if (displayEnd <= VISIBLE_BEATS && endRemBeats > -1) {
                        slimesToDraw.push({ lane: note.lane, depth: displayEnd, isMissed: note.hitState === 3, scale: 0.8, remBeats: endRemBeats });
                    }
                }
            }

            // 4. 对所有史莱姆实体进行严格的 Z 轴（深度）排序，从远到近绘制，完美解决所有图层穿插问题
            slimesToDraw.sort((a, b) => b.depth - a.depth);
            slimesToDraw.forEach(s => {
                const { x, y, sizeFactor } = projectPerspective(s.lane, s.depth);
                const dynamicRadius = baseNoteRadius * sizeFactor * s.scale;
                drawSlime(ctx, x, y, dynamicRadius, LANE_COLORS[s.lane], false, s.isMissed, false, s.remBeats, s.lane);
            });

            // 5. 更新爆炸粒子效果
            updateAndDrawEffects();

            // 5.5 检查是否触发 FC / AP (最后一个音符后 2 拍)
            const lastNote = chartNotes.length > 0 ? chartNotes[chartNotes.length - 1] : null;
            const lastNoteBeat = lastNote ? (lastNote.endBeat || lastNote.beat) : 0;
            
            if (lastNote && !fcApShown && currentBeat >= lastNoteBeat + 2) {
                fcApShown = true;
                const totalHits = judgments.PERFECT + judgments.GREAT + judgments.GOOD + judgments.MISS;
                if (totalHits > 0) {
                    const fcApDisplay = document.getElementById('fcApDisplay');
                    fcApDisplay.style.display = 'block';
                    fcApDisplay.style.animation = 'none';
                    void fcApDisplay.offsetWidth; // 触发重绘重置动画
                    fcApDisplay.style.animation = 'fcApPopup 5s ease-out forwards';
                    
                    if (judgments.MISS === 0) {
                        if (judgments.GREAT === 0 && judgments.GOOD === 0) {
                            fcApDisplay.textContent = 'ALL PERFECT';
                            playSfx(sfxBuffers.all_perfect);
                        } else {
                            fcApDisplay.textContent = 'FULL COMBO';
                            playSfx(sfxBuffers.full_combo);
                        }
                    } else {
                        fcApDisplay.textContent = 'SHOW CLEAR';
                        playSfx(sfxBuffers.clear);
                    }
                }
            }

            // 6. 检查歌曲是否结束
            if (loadedAudioBuffer) {
                const lastNoteTime = chartNotes.length > 0 ? 
                    (chartNotes[chartNotes.length - 1].endTimeMs || chartNotes[chartNotes.length - 1].timeMs) / 1000 
                    : 0;
                // 留出足够的时间确保 5 秒的动画完整播完
                const songDuration = Math.max(loadedAudioBuffer.duration, lastNoteTime + 7);
                
                if (currentAudioTimeSec >= songDuration && !isSongEnding) {
                    isSongEnding = true;
                    songEndingTimeout = setTimeout(showResultScreen, 500);
                }
            }

            // 持续循环
            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
