<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live2D Player</title>
</head>

<body>
  <style>
    :root {
      --theme-hue: 0deg;
      --bg-color: hsl(calc(215deg + var(--theme-hue)), 45%, 12%);
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      overflow: hidden;
    }

    #loading-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 10000;
      background-color: var(--bg-color);
      transition: opacity 0.3s ease;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, hsl(calc(204deg + var(--theme-hue)), 40%, 28%) 0%, var(--bg-color) 70%);
      z-index: 1;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(ellipse 30px 1.5px at 50% 50%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(ellipse 1.5px 30px at 50% 50%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(circle 2.5px at 50% 50%, rgba(255, 255, 255, 1), transparent),
        radial-gradient(ellipse 20px 1px at 20% 80%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(ellipse 1px 20px at 20% 80%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(circle 1.5px at 20% 80%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(ellipse 12px 1px at 80% 30%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(ellipse 1px 12px at 80% 30%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(circle 1px at 80% 30%, rgba(255, 255, 255, 0.6), transparent);
      background-size: 550px 550px, 550px 550px, 550px 550px,
        350px 350px, 350px 350px, 350px 350px,
        250px 250px, 250px 250px, 250px 250px;
      background-position: 0 0, 0 0, 0 0,
        40px 60px, 40px 60px, 40px 60px,
        130px 270px, 130px 270px, 130px 270px;
      opacity: 0.5;
      z-index: 2;
    }

    .expanding-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 100%);
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
    }

    .expanding-circle.expand {
      animation: circleExpand 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes circleExpand {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
      }

      100% {
        width: 300vmax;
        height: 300vmax;
        opacity: 1;
      }
    }

    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
    }
  </style>

  <!-- Loading Layer -->
  <div id="loading-layer">
    <div class="bg-glow"></div>
    <div class="stars"></div>
    <div class="expanding-circle" id="white-circle"></div>
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Live2D 看板娘容器 -->
  <div id="live2d-wrapper">
    <div id="live2d-bg"></div>
    <canvas id="live2d-canvas"></canvas>
    <div id="live2d-dialog"></div>
  </div>

  <!-- 1. PixiJS -->
  <script src="https://unpkg.com/pixi.js@6/dist/browser/pixi.min.js"></script>

  <!-- 2. Live2D Cubism Core -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

  <!-- 3. pixi-live2d-display -->
  <script src="https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <script>
    (function () {
      const wrapper = document.getElementById('live2d-wrapper');
      const canvas = document.getElementById('live2d-canvas');
      const dialogBox = document.getElementById('live2d-dialog');

      // ======= 加载层初始化 =======
      const savedHue = localStorage.getItem('slime_hue');
      if (savedHue !== null) {
        document.documentElement.style.setProperty('--theme-hue', savedHue + 'deg');
      }

      const loadingLayer = document.getElementById('loading-layer');
      const whiteCircle = document.getElementById('white-circle');
      const particleCanvas = document.getElementById('particle-canvas');
      const pCtx = particleCanvas.getContext('2d');

      let isModelLoaded = false;
      let isIntroAnimationFinished = false;
      let triggerLive2DStart = null;
      let animFadeOutStarted = false;

      // 测试开关：设为 true 时强制加载等待 5 秒
      const TEST_5S_LOAD = false;

      const enterAudio = new Audio('./sfx/enter.mp3');
      enterAudio.play().catch(e => console.warn('自动播放enter.mp3被拦截', e));

      whiteCircle.classList.add('expand');

      function resizeCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const particles = [];
      const isMobileDevice = window.innerWidth <= 768;
      const particleCount = isMobileDevice ? 120 : 250; // 移动端减少粒子数量以优化性能
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      // 计算屏幕对角线距离，作为圆形爆裂的最大半径
      const maxDist = Math.sqrt(centerX * centerX + centerY * centerY) + 50;

      // 使用圆形分布，这样爆裂时会呈现完美的圆形扩散
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const targetDist = (0.1 + Math.random() * 0.9) * maxDist;
        const targetX = centerX + Math.cos(angle) * targetDist;
        const targetY = centerY + Math.sin(angle) * targetDist;

        const size = 10 + Math.random() * 40;
        const hue = Math.random() * 360;

        // 性能优化：为每个碎片预先在一个离屏画布上绘制好（包括复杂的多重渐变和发光），避免在主循环中逐帧重复绘制带来卡顿
        const pCanvas = document.createElement('canvas');
        const padding = 20; // 留出发光的空间
        pCanvas.width = size + padding * 2;
        pCanvas.height = size + padding * 2;
        const offCtx = pCanvas.getContext('2d');

        offCtx.translate(pCanvas.width / 2, pCanvas.height / 2);

        const gradient = offCtx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
        gradient.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.85)`);
        gradient.addColorStop(0.5, `hsla(${(hue + 45) % 360}, 100%, 85%, 0.85)`);
        gradient.addColorStop(1, `hsla(${(hue + 90) % 360}, 100%, 85%, 0.85)`);

        offCtx.fillStyle = gradient;

        offCtx.beginPath();
        offCtx.moveTo(0, -size / 2);
        offCtx.lineTo(size / 2, size / 2);
        offCtx.lineTo(-size / 2, size / 2);
        offCtx.closePath();
        offCtx.fill();

        offCtx.lineJoin = 'round';
        for (let w = 15; w >= 3; w -= 3) {
          offCtx.lineWidth = w;
          offCtx.strokeStyle = gradient;
          offCtx.globalAlpha = 0.05 + (15 - w) * 0.015;
          offCtx.stroke();
        }

        offCtx.globalAlpha = 0.6;
        offCtx.lineWidth = 1;
        offCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        offCtx.stroke();

        particles.push({
          x: centerX,
          y: centerY,
          startX: centerX,
          startY: centerY,
          targetDist: targetDist,
          angle: angle,
          vx: 0,
          vy: 0,
          baseVx: Math.cos(angle) * (0.05 + Math.random() * 0.125),
          baseVy: Math.sin(angle) * (0.05 + Math.random() * 0.125),
          size: size,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.02,
          hue: hue,
          img: pCanvas,
          imgSize: pCanvas.width
        });
      }

      let animationStartTime = Date.now();
      let animFrameId;
      let currentPhase = 1; // 1: 爆裂 (0~0.3s), 2: 等待与飘散 (>=0.3s), 3: 淡出与加速 (0.3s)
      let phase3StartTime = 0;

      function renderParticles() {
        pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

        const elapsed = Date.now() - animationStartTime;

        if (currentPhase === 1 && elapsed >= 300) {
          currentPhase = 2;
          document.querySelector('.bg-glow').style.display = 'none';
          document.querySelector('.stars').style.display = 'none';
        }

        const waitTime = TEST_5S_LOAD ? 5000 : 1700;
        if (currentPhase === 2 && elapsed >= waitTime && isModelLoaded && !animFadeOutStarted) {
          currentPhase = 3;
          animFadeOutStarted = true;
          phase3StartTime = Date.now();
          loadingLayer.style.opacity = '0';
          setTimeout(() => {
            loadingLayer.style.display = 'none';
            if (triggerLive2DStart) triggerLive2DStart();
          }, 300);
        }

        particles.forEach(p => {
          if (currentPhase === 1) {
            // Phase 1 (0-300ms): 快 -> 慢 (easeOutCubic)
            const t = Math.min(elapsed / 300, 1.0);
            const easeT = 1 - Math.pow(1 - t, 3);

            const currentDist = p.targetDist * easeT;
            const newX = centerX + Math.cos(p.angle) * currentDist;
            const newY = centerY + Math.sin(p.angle) * currentDist;

            // 记录瞬时速度，方便平滑过渡到阶段2
            p.vx = newX - p.x;
            p.vy = newY - p.y;
            p.x = newX;
            p.y = newY;
          } else if (currentPhase === 2) {
            // Phase 2: 缓慢飘散期
            p.vx = p.vx * 0.95 + p.baseVx * 0.05;
            p.vy = p.vy * 0.95 + p.baseVy * 0.05;
            p.x += p.vx;
            p.y += p.vy;
          } else if (currentPhase === 3) {
            // Phase 3 (0-300ms): 慢 -> 快 (easeInCubic 加速向外)
            const phase3Elapsed = Date.now() - phase3StartTime;
            const t3 = Math.min(phase3Elapsed / 300, 1.0);
            const easeT3 = t3 * t3 * t3; // easeInCubic

            const dx = p.x - centerX;
            const dy = p.y - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const dirX = dx / dist;
            const dirY = dy / dist;

            const accel = easeT3 * 10;
            p.vx += dirX * accel;
            p.vy += dirY * accel;

            p.x += p.vx;
            p.y += p.vy;
          }

          p.rotation += p.rotSpeed;

          pCtx.save();
          pCtx.translate(p.x, p.y);
          pCtx.rotate(p.rotation);

          // 直接绘制预渲染好的离屏画布，性能极高
          pCtx.drawImage(p.img, -p.imgSize / 2, -p.imgSize / 2);

          pCtx.restore();
        });

        if (loadingLayer.style.display !== 'none') {
          animFrameId = requestAnimationFrame(renderParticles);
        }
      }

      renderParticles();

      // ======= 音乐配置 =======
      const MUSIC_URL = "./assets/music.mp3";                                          // 此处更换音乐
      const bgm = new Audio(MUSIC_URL);
      bgm.crossOrigin = "anonymous"; // 必须跨域才能被 AudioContext 分析
      bgm.preload = "auto";
      
      // 音频分析器相关变量
      let audioCtx, analyser, dataArray;

      const bgLayer = document.getElementById('live2d-bg');

      // 限制分辨率，避免手机上超大画布导致 WebGL 崩溃
      const RESOLUTION = Math.min(window.devicePixelRatio || 1, 2);

      const app = new PIXI.Application({
        view: canvas,
        autoStart: true,
        transparent: true,
        autoDensity: true,           // 仍然自适应 DPR，但最多放大到 2 倍
        resolution: RESOLUTION,
        antialias: true,
      });

      // ======= 依赖检查 =======
      if (!PIXI.live2d || !PIXI.live2d.Live2DModel) {
        console.error('pixi-live2d-display 未正确加载');
        return;
      }
      const Live2DModel = PIXI.live2d.Live2DModel;
      const MotionPriority = PIXI.live2d.MotionPriority;

      // ======= 模型配置 =======
      const MODEL_URL = "./assets/v2_clb01_21miku_t03/v2_clb01_21miku_t03.model3.json";             // 此处更换模型文件（.model3.json）

      // ======= 加载模型 =======
      Live2DModel.from(MODEL_URL, { autoInteract: false }).then(model => {
        app.stage.addChild(model);

        // 禁用 idle 自动待机动作
        if (model.internalModel.motionManager && model.internalModel.motionManager.groups) {
          model.internalModel.motionManager.groups.idle = '';
        }

        // ======= 响应式布局 =======
        function layoutModel() {
          // 用实际 DOM 尺寸，而不是 renderer 内部尺寸
          const rect = wrapper.getBoundingClientRect();
          const w = rect.width;
          const h = rect.height;

          const isMobile = window.innerWidth <= 768;

          if (isMobile) {
            // 移动端布局：中心对齐，适当缩小以适配竖屏视口
            model.anchor.set(0.5, 0.5);    // 以人物中心为锚点
            model.scale.set(0.2);

            model.x = w * 0.5;
            model.y = h - 300;
          } else {
            // PC端布局：底部对齐，保持较大比例
            model.anchor.set(0.5, 0.35);
            model.scale.set(0.3);

            model.x = w * 0.5;
            model.y = h * 0.5;
          }
        }

        function resizeApp() {
          const rect = wrapper.getBoundingClientRect();
          app.renderer.resize(rect.width, rect.height);
          layoutModel();
        }

        // 初始化并监听各类窗口尺寸变化事件
        resizeApp();
        ['resize', 'orientationchange', 'fullscreenchange', 'webkitfullscreenchange'].forEach(ev => {
          window.addEventListener(ev, resizeApp);
        });

        // ======= 鼠标控制视线 =======
        window.addEventListener('pointermove', (event) => {
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          model.focus(x, y);
        });

        // ======= 异步延迟工具函数 =======
        function delay(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ======= 封装动作播放：身体动作 =======
        function playBodyMotion(groupName, priority = MotionPriority.FORCE) {
          const settings = model.internalModel.settings;
          const motions = settings.motions || settings.Motions || {};
          const group = motions[groupName];
          if (!group || !group.length) {
            console.warn('没有找到身体动作组:', groupName);
            return;
          }
          return model.motion(groupName, 0, priority);
        }

        // ======= 封装动作播放：面部表情 =======
        function playFaceMotion(groupName, priority = MotionPriority.FORCE) {
          const settings = model.internalModel.settings;
          const motions = settings.motions || settings.Motions || {};
          const group = motions[groupName];
          if (!group || !group.length) {
            console.warn('没有找到面部动作组:', groupName);
            return;
          }
          return model.motion(groupName, 0, priority);
        }

        // ======= 眨眼 =======
        const coreModel = model.internalModel.coreModel;
        const EYE_L_ID = 'ParamEyeLOpen';
        const EYE_R_ID = 'ParamEyeROpen';

        // 眨眼状态机
        let blinkState = 'wait';   // 'wait' | 'closing' | 'opening'
        let waitTimer = 0;
        let phaseTimer = 0;
        let nextBlinkTime = 2 + Math.random() * 3;   // 下一次眨眼间隔（秒）
        const blinkPhaseDuration = 0.08;             // 闭眼 / 睁眼各自时长（秒）

        // 每次眨眼前记录当时的基础眼睛开合
        let baseEyeL = 1.0;
        let baseEyeR = 1.0;

        app.ticker.add(() => {
          if (!coreModel) return;

          // 用真实时间，每帧毫秒 / 1000
          const dt = app.ticker.deltaMS / 1000;

          if (blinkState === 'wait') {
            // 等待下一次眨眼
            waitTimer += dt;
            if (waitTimer >= nextBlinkTime) {
              waitTimer = 0;
              blinkState = 'closing';
              phaseTimer = 0;

              // 每次眨眼前，记录当前眼睛基础值（可能不是 1）
              baseEyeL = coreModel.getParameterValueById(EYE_L_ID);
              baseEyeR = coreModel.getParameterValueById(EYE_R_ID);
            }
          } else if (blinkState === 'closing') {
            // 闭眼阶段
            phaseTimer += dt;
            let t = phaseTimer / blinkPhaseDuration;
            if (t > 1) t = 1;

            const vL = baseEyeL * (1 - t);
            const vR = baseEyeR * (1 - t);
            coreModel.setParameterValueById(EYE_L_ID, vL);
            coreModel.setParameterValueById(EYE_R_ID, vR);

            if (t >= 1) {
              blinkState = 'opening';
              phaseTimer = 0;
            }
          } else if (blinkState === 'opening') {
            // 睁眼阶段
            phaseTimer += dt;
            let t = phaseTimer / blinkPhaseDuration;
            if (t > 1) t = 1;

            const vL = baseEyeL * t;
            const vR = baseEyeR * t;
            coreModel.setParameterValueById(EYE_L_ID, vL);
            coreModel.setParameterValueById(EYE_R_ID, vR);

            if (t >= 1) {
              blinkState = 'wait';
              waitTimer = 0;
              nextBlinkTime = 2 + Math.random() * 3;   // 下一次眨眼间隔再随机
            }
          }
          
          // ======= 音频实时驱动嘴巴张合 =======
          if (analyser && dataArray) {
            analyser.getByteFrequencyData(dataArray);
            
            // 截取人声比较集中的中低频段来计算能量
            let sum = 0;
            const startBin = 2; 
            const endBin = Math.min(50, dataArray.length);
            for (let i = startBin; i < endBin; i++) {
              sum += dataArray[i];
            }
            const average = sum / (endBin - startBin);
            
            // 将音量映射为 0~1 的目标张合度
            let targetMouthOpen = (average - 5) / 80; 
            targetMouthOpen = Math.max(0, Math.min(targetMouthOpen, 1));
            
            // 加入平滑插值 (Lerp)，防止嘴巴像抽搐一样高频抖动
            // currentMouthOpen 越靠近 target，速度越慢。0.15 是平滑系数，越小越平滑但可能会有延迟感
            if (typeof window.currentMouthOpen === 'undefined') window.currentMouthOpen = 0;
            window.currentMouthOpen += (targetMouthOpen - window.currentMouthOpen) * 0.15;
            
            // 实时强制覆盖嘴巴张合参数
            coreModel.setParameterValueById('ParamMouthOpenY', window.currentMouthOpen);
          }
        });


        // ======= 开场动作 =======
        async function playOpeningAnimation() {                                   // 此处更改开场动作
          playBodyMotion('w-adult12-glad');
          await delay(1000);
          playFaceMotion('face_band_closeeye_03');
          await delay(500); // 给一点表情过渡时间
        }

        // ======= LRC歌词 =======
        const lrcText = `
[00:00.00]きっと届くはず　きっと見えるはず 
一定能传达给你　一定能把你看见
[00:09.34]そんな会ってみたい未来を　僕はひとりきりのセカイで 
那般我们想追逐的未来　有我在这孤身一人的世界
[00:15.06]ずっとそう歌うたっていた 
一直这样歌唱着它们
[00:19.98]

现在我听到了　你看我能够稍微
[00:33.65]君を感じたよ　メロディーがリンクする 
感受到你了啊　旋律交织将我们连结
[00:40.42]今繋がるよ　今重なるよ 
此刻情感相连　此刻心愿交汇
[00:46.36]伝えたかったこと　山ほどあるんだけどどうしよう 
想要传达的心意　堆得像山一样　该怎么办呢
[00:54.50]
[00:57.35]見たこともない顔で　君は君をダメと言うけど 
你面露我所未见的神情　坦言自己百无一用

但我愿你不必过于执着　去强求未来那个完美的你

        // ======= LRC格式解析 =======
        function parseLRC(text) {
          const lines = text.split('\n');
          const result = [];
          let lastEntry = null;

          for (let raw of lines) {
            const line = raw.replace(/\r/g, '');
            if (!line.trim()) continue;  // 空行直接跳过

            // 匹配时间戳 [mm:ss.ms]
            const match = line.match(/\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?]/);
            if (match) {
              const min = parseInt(match[1], 10);
              const sec = parseInt(match[2], 10);
              const ms = match[3] ? parseInt(match[3].padEnd(3, '0'), 10) : 0;
              const content = line
                .replace(/\[\d{2}:\d{2}(?:\.\d{1,3})?]/, '')
                .trim();  // 允许为空，用来关气泡

              const entry = {
                time: min * 60 + sec + ms / 1000,
                text: content
              };
              result.push(entry);
              lastEntry = entry;
            } else {
              // 无时间标签但有文字：作为上一句的“续行”
              if (lastEntry) {
                if (lastEntry.text) {
                  lastEntry.text += '\n' + line.trim();
                } else {
                  lastEntry.text = line.trim();
                }
              }
            }
          }
          // 按时间升序排列，确保二分查找或顺序遍历正确
          return result.sort((a, b) => a.time - b.time);
        }

        const scriptData = parseLRC(lrcText);
        let currentIndex = -1;
        let finishedOnce = false;
        let lyricsStarted = false;
        let dialogTimer = null;

        // ======= 口型同步控制 =======
        let lipSyncTimer = null;

        // 简单的假名->元音映射字典
        const kanaToVowel = {
          'あ': 'a', 'か': 'a', 'さ': 'a', 'た': 'a', 'な': 'a', 'は': 'a', 'ま': 'a', 'や': 'a', 'ら': 'a', 'わ': 'a',
          'が': 'a', 'ざ': 'a', 'だ': 'a', 'ば': 'a', 'ぱ': 'a', 'ゃ': 'a', 'ぁ': 'a',
          'い': 'i', 'き': 'i', 'し': 'i', 'ち': 'i', 'に': 'i', 'ひ': 'i', 'み': 'i', 'り': 'i',
          'ぎ': 'i', 'じ': 'i', 'ぢ': 'i', 'び': 'i', 'ぴ': 'i', 'ぃ': 'i',
          'う': 'u', 'く': 'u', 'す': 'u', 'つ': 'u', 'ぬ': 'u', 'ふ': 'u', 'む': 'u', 'ゆ': 'u', 'る': 'u', 'ん': 'u',
          'ぐ': 'u', 'ず': 'u', 'づ': 'u', 'ぶ': 'u', 'ぷ': 'u', 'ゅ': 'u', 'ぅ': 'u',
          'え': 'e', 'け': 'e', 'せ': 'e', 'て': 'e', 'ね': 'e', 'へ': 'e', 'め': 'e', 'れ': 'e',
          'げ': 'e', 'ぜ': 'e', 'で': 'e', 'べ': 'e', 'ぺ': 'e', 'ぇ': 'e',
          'お': 'o', 'こ': 'o', 'そ': 'o', 'と': 'o', 'の': 'o', 'ほ': 'o', 'も': 'o', 'よ': 'o', 'ろ': 'o', 'を': 'o',
          'ご': 'o', 'ぞ': 'o', 'ど': 'o', 'ぼ': 'o', 'ぽ': 'o', 'ょ': 'o', 'ぉ': 'o'
        };
        const vowels = ['a', 'e', 'i', 'o', 'u']; // 对应的5个外部动作后缀

        let lastVowel = 'a'; // 记录上一个发音
        
        function getVowel(char) {
          if (kanaToVowel[char]) {
            lastVowel = kanaToVowel[char];
            return kanaToVowel[char];
          }
          // 对于汉字等无法简单判断的字符，优先保持上一个嘴型
          // 这样能大幅减少在遇到大量汉字时嘴型剧烈突变抽搐的问题
          return lastVowel;
        }

        function playLipSync(japaneseText, durationSeconds) {
          stopLipSync(); // 清除之前的状态

          // 过滤掉标点符号和空格
          const cleanText = japaneseText.replace(/[\s　、。！？,!?]/g, '');
          if (cleanText.length === 0) return;

          let charIndex = 0;
          
          // 根据整句可用时间，平摊给每个字
          // 留出 10% 的时间作为最后闭嘴的缓冲
          let syllableDuration = (durationSeconds * 1000 * 0.9) / cleanText.length;
          
          // 限制每个字的极限时长：最快 80ms，最慢 400ms（防止间奏太长导致嘴巴像慢动作一样张着）
          syllableDuration = Math.max(80, Math.min(syllableDuration, 400));

          function nextMouth() {
            if (charIndex >= cleanText.length) {
              stopLipSync();
              return;
            }
            const vowel = getVowel(cleanText[charIndex]);
            // 调用对应的嘴型动画
            playFaceMotion(`face_band_${vowel}_01`, MotionPriority.FORCE);
            charIndex++;
          }

          // 立即触发第一个字
          nextMouth();
          lipSyncTimer = setInterval(nextMouth, syllableDuration);
        }

        function stopLipSync() {
          if (lipSyncTimer) {
            clearInterval(lipSyncTimer);
            lipSyncTimer = null;
          }
          // 已经由 AudioContext 实时根据音量控制嘴巴张合，静音时会自动闭嘴，无需再强制触发闭嘴动画
        }

        // ======= 台词刷新函数 =======
        function updateDialog() {
          if (!scriptData.length) return;

          // 直接读取音频的当前播放时间，确保歌词和音乐绝对同步，无延迟
          const elapsed = bgm.currentTime;
          let idx = currentIndex;

          // 倒序遍历查找当前时间点对应的歌词索引
          for (let i = scriptData.length - 1; i >= 0; i--) {
            if (elapsed >= scriptData[i].time) {
              idx = i;
              break;
            }
          }

          if (idx !== currentIndex && idx >= 0) {
            currentIndex = idx;
            const line = scriptData[idx];

            // 计算当前句子的持续时间（直到下一句的时间）
            let nextTime = bgm.duration || line.time + 5;
            if (idx + 1 < scriptData.length) {
              nextTime = scriptData[idx + 1].time;
            }
            const duration = Math.max(0.1, nextTime - line.time);

            if (line.text && line.text.length > 0) {
              dialogBox.textContent = line.text;
              dialogBox.classList.add('show');

              // 提取第一行（日语）并开始对口型，传入预计时长
              const jpLine = line.text.split('\n')[0];
              playLipSync(jpLine, duration);
            } else {
              // 文本为空时隐藏对话框
              dialogBox.textContent = "";
              dialogBox.classList.remove('show');
              // 歌词块为空白时停止对口型（闭嘴）
              stopLipSync();
            }
          }

          // ======= 谢幕动作 =======
          const lastTime = scriptData[scriptData.length - 1].time;
          if (!finishedOnce && elapsed >= lastTime) {
            finishedOnce = true;

            (async () => {                                              // 此处更改谢幕动作
              stopLipSync(); // 确保对口型定时器停止
              playFaceMotion('face_band_smile_08');
              await delay(300);
              playBodyMotion('w-adult01-shakehand');
              await delay(4000);
              playBodyMotion('w-normal01-glad');
              await delay(2000); // 让最后的动作展示一会儿
              window.location.href = 'index.html'; // 自动返回主页
            })();

            if (dialogTimer) {
              clearInterval(dialogTimer);
              dialogTimer = null;
            }
          }
        }

        // ======= 音乐+台词启动函数 =======
        function startLyrics() {
          if (lyricsStarted) return;
          lyricsStarted = true;
          dialogTimer = setInterval(updateDialog, 50); // 提高刷新频率到 50ms 使字幕更丝滑
        }

        // 浏览器自动播放策略
        function startBgmAndLyrics() {
          function initAudioAnalyzer() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(bgm);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
          }

          bgm.play().then(() => {
            initAudioAnalyzer();
            startLyrics();
          }).catch(err => {
            console.warn("音乐自动播放被阻止，等待用户交互...", err);
            const resume = () => {
              bgm.play().then(() => {
                initAudioAnalyzer();
                startLyrics();
              }).catch(() => { });
              document.removeEventListener('click', resume);
            };
            document.addEventListener('click', resume, { once: true });
          });
        }

        // 模型加载完成后，交由加载层控制启动时机
        triggerLive2DStart = async () => {
          await playOpeningAnimation();
          startBgmAndLyrics();
        };
        isModelLoaded = true;
      }).catch(err => {
        console.error("Live2D 模型加载失败：", err);
      });
    })();
